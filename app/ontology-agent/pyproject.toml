[project]
name = "ontology-agent"
version = "0.1.0"
description = "온톨로지 데모 — 메달리온 전 계층 DB + 계층 탐색 + KPI 그래프 + AI 채팅 (기록 09)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "open-kknaks>=2.1.2",
    "redis>=5.0",
    "mcp>=1.9,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
