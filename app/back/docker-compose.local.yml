# 로컬 오버레이 — 기존 docker-compose.yml(db·redis·worker)은 안 고치고
# back 을 얹고 worker 에 로컬(맥) 전용 마운트를 더한다.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build back worker
#
# - 호스트 48000 — 로컬 백엔드는 이 컨테이너 하나다 (uvicorn dev 서버는 안 쓴다)
# - 설정은 전부 .env (env_file) — environment 로 덮지 않는다(사용자 결정).
#   그래서 .env 의 접속 주소는 컨테이너 기준이다: host.docker.internal:45433/46379
# - /ledger — 리뉴얼 레포 루트를 **rw** 로 mount(REPO_ROOT·LEDGER_PATH=/ledger 는 .env).
#   승인 착지(md 쓰기 + commit)가 여기 쓴다 — 로컬은 JOB_GIT_PUSH_DRY_RUN=1 이라
#   push 는 스킵(로컬 커밋까지만). worker 는 읽기만 하므로 ro 유지(docker-compose.yml).
# - 호스트에서 alembic 등을 돌릴 땐 컨테이너로: docker exec kknaks-back uv run alembic …
#   (.env 의 주소가 컨테이너 기준이라 호스트 셸에서는 안 풀린다)

services:
  back:
    build: .
    container_name: kknaks-back
    env_file: .env
    ports:
      - "48000:8000"
    volumes:
      # rw — 승인 착지가 md 를 쓰고 그 파일만 commit 한다(위 머리 주석).
      - ../..:/ledger
      # 리뉴얼 디렉토리는 **linked worktree** 다 — /ledger/.git 이 아래 메인 레포의
      # .git/worktrees/리뉴얼 을 절대경로로 가리킨다. 같은 절대경로에 rw 로 얹어야
      # 컨테이너 안에서 git commit 이 된다(커밋 객체·ref 는 메인 .git 에 쓰인다).
      # 이 맥 전용 — prod(홈서버)는 일반 clone 이라 이 마운트가 없다.
      - /Users/kknaks/git/toy_pr2/kknaks_profile/.git:/Users/kknaks/git/toy_pr2/kknaks_profile/.git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # 로컬(맥) 전용 — Dockerfile.worker 는 codex 를 이미지에 안 박고 런타임 마운트
    # 전제다. 호스트의 리눅스용 CLI 번들(axkg 공용 — linux/arm64 node +
    # @openai/codex + @anthropic-ai/claude-code)을 ro 마운트하고 PATH 최우선으로
    # 잡는다 (open-kknaks 는 shutil.which("codex") 로만 찾는다).
    environment:
      PATH: /claude-tools/node/bin:/claude-tools/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - /Users/kknaks/.cache/axkg-live/.claude-tools:/claude-tools:ro
      # codex 세션 영속 — CODEX_HOME(/root/.codex) 을 명명 볼륨으로. 문서→개념의
      # resume(mode=session) 이 워커 재시작을 넘겨 살아남는 조건이다.
      - codex-sessions:/root/.codex
      # codex 인증 — **로컬 검증 한정**. 호스트 로그인 결과(auth.json)를 파일 하나만
      # ro 로 얹는다. 파일 하나만인 이유 = 세션은 위 CODEX_HOME 명명 볼륨이 갖고,
      # 호스트 세션 디렉터리를 통째로 내주면 컨테이너가 사용자 작업 세션을 건드리기
      # 때문이다. ⚠ 배포 환경은 이 줄을 쓰지 않는다 — 시크릿 마운트로 같은 경로에
      # 넣는다(이미지에 굽지 않는다).
      #
      # 경로가 ~/.codex/auth.json 이 아닌 이유(2026-08-25 실측): 이 맥의 살아 있는
      # codex 로그인은 orca 가 CODEX_HOME 으로 관리하는 아래 파일이다. ~/.codex 쪽은
      # 2026-08-07 revoke 후 갱신이 끊겨 refresh token 이 죽어 있다(already used).
      # ro 마운트라 컨테이너는 refresh 를 못 쓰는데, 이 파일은 호스트(orca) 사용이
      # 계속 갱신하므로 access token 이 낡기 전에 자연 회전된다.
      - "${HOME}/Library/Application Support/orca/codex-runtime-home/home/auth.json:/root/.codex/auth.json:ro"

volumes:
  # 워커의 codex 세션(문서→개념 resume) — 재시작을 넘겨 살아남아야 한다.
  codex-sessions:
