# 로컬 dev — postgres + redis + worker. back 은 docker-compose.local.yml 이 얹는다.
# 포트 컨벤션 — 호스트는 4-prefix, 컨테이너 내부는 기본 포트.
# redis 포트 노출은 유지한다 — 호스트 폴백 워커(scripts/run-worker.sh)와
# 호스트 셸 디버깅이 이 포트로 붙는다.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kknaks-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kknaks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kknaks}
      POSTGRES_DB: ${POSTGRES_DB:-kknaks}
    ports:
      - "45433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kknaks} -d ${POSTGRES_DB:-kknaks}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kknaks-redis
    ports:
      - "46379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    # open-kknaks 워커 — back 이 redis 에 제출한 AI 태스크(provider=codex)를 실행
    # (inbox.md Step 6·7). codex CLI 는 이미지에 없다 — 런타임 마운트로 온다
    # (로컬: docker-compose.local.yml 의 claude-tools 번들 + PATH 최우선).
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: kknaks-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      # back 과 일치해야 한다 — config.py 의 ai_namespace / ai_queue (기본값 그대로).
      AI_NAMESPACE: kknaks_profile
      AI_QUEUE: default
      # codex 의 읽기 전용 cwd — 아래 원장 마운트 경로. back 의 .env AI_CWD 와 같은
      # 값이어야 한다(back 이 task.options.cwd 로 이 경로를 실어 보낸다).
      AI_CWD: /ledger
      CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      # 이미지 ENV 와 같은 값을 다시 박는 이유 = 세션 볼륨 마운트 경로와 한 눈에
      # 대조되게 하려는 것(둘이 어긋나면 세션이 매 재시작 사라진다).
      # ⚠ 인증(auth.json)은 이미지에도 이 파일에도 없다 — 로컬은 local.yml 이
      #    호스트 ~/.codex/auth.json 을 ro 로 얹고, 배포는 시크릿 마운트로 넣는다.
      CODEX_HOME: /root/.codex
    volumes:
      # 원장 — 리뉴얼 레포 루트를 읽기 전용으로. codex cwd(/ledger)이자
      # output_schema 경로(/ledger/app/back/ai_schemas)의 출처다.
      - ../..:/ledger:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 컨테이너가 codex 를 못 찾으면 태스크를 집은 뒤에야 실패한다 — 기동 시점에
    # unhealthy 로 드러나는 편이 낫다 (CLI 마운트 누락 검출).
    healthcheck:
      test: ["CMD", "codex", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
