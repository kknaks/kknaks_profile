# 로컬 dev — 지금은 postgres 만. back · open-kknaks 는 컨테이너화할 때 붙인다.
# 포트 컨벤션 — 호스트는 4-prefix, 컨테이너 내부는 기본 포트.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kknaks-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kknaks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kknaks}
      POSTGRES_DB: ${POSTGRES_DB:-kknaks}
    ports:
      - "45433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kknaks} -d ${POSTGRES_DB:-kknaks}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
