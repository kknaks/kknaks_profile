[project]
name = "kknaks-back"
version = "0.1.0"
description = "kknaks.dev backend — FastAPI in-memory persona server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "open-kknaks==2.0.2",          # AgentClient provider 계약 — worker와 버전 일치
    "redis>=5.0",                  # open-kknaks broker
    "slack-bolt>=1.28",            # Socket Mode knowledge capture bridge
    "aiohttp>=3.13.5",             # slack-bolt AsyncApp/Socket Mode runtime
    "pypdf>=5.0",                  # paper PDF text extraction
    "apscheduler>=3.10",
    "yt-dlp>=2024.12",             # YouTube 메타데이터 (content enrich 잡)
    "youtube-transcript-api>=0.6", # YouTube 자막 (content enrich 잡)
    "playwright>=1.49",            # PDF 생성 잡 (planning-02) — chromium headless 로 /print/* 라우트 → PDF
    "sqlalchemy[asyncio]>=2.0",    # DB화 토대 (auth-01) — ORM 2.0 async 세션 (greenlet 포함)
    "alembic>=1.13",               # 스키마 마이그레이션 버전 관리
    "psycopg[binary]>=3.2",        # PostgreSQL 드라이버 (postgresql+psycopg://)
    "bcrypt>=4.2",                 # admin 비밀번호 해시
    "pyjwt>=2.9",                  # 쿠키 JWT 발급/검증
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
