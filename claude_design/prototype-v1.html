<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kknaks.dev — portfolio (v1.0-pre · slot edition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <style>
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .page-fade { animation: pageFade 220ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
    @keyframes pageFade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    /* slot highlight — visualize unreplaced tokens */
    .slot {
      display: inline;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px dashed var(--accent-line);
      border-radius: 3px;
      padding: 0 4px;
      font-family: var(--font-mono);
      font-size: 0.85em;
      font-weight: 400;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .slot.block {
      display: block;
      padding: 6px 8px;
      margin: 2px 0;
    }
    .slot-banner {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      z-index: 100;
      background: var(--bg-1); border: 1px solid var(--accent-line);
      color: var(--fg-1); font-family: var(--font-mono); font-size: 11px;
      padding: 8px 14px; border-radius: 4px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: var(--shadow-pop);
    }
    .slot-banner b { color: var(--accent); font-weight: 500; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="js/proto-shell-slots.jsx"></script>
  <script type="text/babel" src="js/proto-home-slots.jsx"></script>
  <script type="text/babel" src="js/proto-subpages-slots.jsx"></script>
  <script type="text/babel" src="js/proto-notes-slots.jsx"></script>
  <script type="text/babel" src="js/proto-contents-slots.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { TopNav, PageFooter, useI18n,
            HeroTerminal, LandingPreview,
            ProtoAbout, ProtoCareer, ProtoProjects, ProtoNotes, ProtoContents } = window;

    function App() {
      const [route, setRoute] = useState(() => {
        const h = (location.hash || '').replace('#', '');
        const base = h.split('/')[0];
        return ['home','about','career','projects','notes','contents'].includes(base) ? h : 'home';
      });
      const [lang, setLang] = useI18n();

      useEffect(() => {
        location.hash = route;
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, [route]);

      const baseRoute = route.split('/')[0];
      const subRoute = route.split('/').slice(1).join('/') || null;
      let body;
      if (baseRoute === 'about')         body = <ProtoAbout lang={lang} />;
      else if (baseRoute === 'career')   body = <ProtoCareer lang={lang} />;
      else if (baseRoute === 'projects') body = <ProtoProjects lang={lang} />;
      else if (baseRoute === 'notes')    body = <ProtoNotes lang={lang} />;
      else if (baseRoute === 'contents') body = <ProtoContents lang={lang} subRoute={subRoute} setRoute={setRoute} />;
      else body = (
        <>
          <HeroTerminal lang={lang} setRoute={setRoute} />
          <LandingPreview lang={lang} setRoute={setRoute} />
        </>
      );

      return (
        <div data-screen-label={baseRoute}>
          <TopNav route={baseRoute} setRoute={setRoute} lang={lang} setLang={setLang} />
          <main key={route} className="page-fade">{body}</main>
          <PageFooter lang={lang} />
          <div className="slot-banner">
            <span>v1.0-pre · <b>slot edition</b></span>
            <span style={{ color: 'var(--fg-3)' }}>|</span>
            <span style={{ color: 'var(--fg-2)' }}>주황 박스 = 백엔드 슬롯</span>
            <span style={{ color: 'var(--fg-3)' }}>|</span>
            <span style={{ color: 'var(--fg-2)' }}>lang={lang}</span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
