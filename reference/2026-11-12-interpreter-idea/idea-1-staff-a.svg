<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="AppleGothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title>1단계 직원 화면 선택지 A — 지금 통키 화면 그대로(원격 1건)</title>
<defs></defs>
<rect width="760" height="640" fill="#ffffff"/>
<text x="24" y="30" font-size="15" fill="#222" text-anchor="start" font-weight="bold">1단계 · 직원 화면 선택지 A — 지금 통키 화면 그대로</text>
<rect x="40" y="60" width="300" height="540" rx="22" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="50" y="74" width="280" height="512" rx="12" fill="#f4f5f7" stroke="#f4f5f7" stroke-width="1.2"/>
<text x="190.0" y="622" font-size="13" fill="#666" text-anchor="middle" font-weight="bold">원격으로 연결된 고객 한 명</text>
<text x="66" y="106" font-size="14" fill="#2498bd" text-anchor="start" font-weight="bold">≡  Tongky</text>
<rect x="182" y="90" width="136" height="24" rx="12" fill="#fdf1e4" stroke="#d9822b" stroke-width="1.2"/>
<text x="250" y="107" font-size="10" fill="#d9822b" text-anchor="middle" font-weight="normal">원격 · 상담실(예시)</text>
<rect x="62" y="122" width="256" height="170" rx="10" fill="#fff" stroke="#ddd" stroke-width="1.2"/>
<text x="72" y="144" font-size="12" fill="#222" text-anchor="start" font-weight="normal">English</text>
<text x="308" y="144" font-size="10" fill="#c0392b" text-anchor="end" font-weight="normal">선택지: 고객 화면 미러</text>
<rect x="72" y="160" width="177.0" height="25" rx="10" fill="#f4f5f7" stroke="#f4f5f7" stroke-width="1.2"/>
<text x="82" y="176" font-size="11" fill="#222" text-anchor="start" font-weight="normal">Where is the restroom?</text>
<circle cx="190" cy="350" r="28" fill="#2498bd"/>
<text x="190" y="396" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">말씀하세요 — 고객 폰으로 갑니다</text>
<rect x="62" y="410" width="256" height="160" rx="10" fill="#fff" stroke="#ddd" stroke-width="1.2"/>
<rect x="72" y="422" width="177.0" height="25" rx="10" fill="#f4f5f7" stroke="#f4f5f7" stroke-width="1.2"/>
<text x="82" y="438" font-size="11" fill="#222" text-anchor="start" font-weight="normal">화장실이 어디예요?</text>
<rect x="131.0" y="456" width="177.0" height="25" rx="10" fill="#2498bd" stroke="#2498bd" stroke-width="1.2"/>
<text x="141.0" y="472" font-size="11" fill="#fff" text-anchor="start" font-weight="normal">복도 끝 왼쪽이에요.</text>
<text x="380" y="110" font-size="12" fill="#222" text-anchor="start" font-weight="normal">· 화면 구성은 0단계와 같다</text>
<text x="380" y="134" font-size="12" fill="#222" text-anchor="start" font-weight="normal">· 다른 점: 외국어 영역을 뒤집지 않는다</text>
<text x="380" y="158" font-size="12" fill="#222" text-anchor="start" font-weight="normal">   (고객은 자기 폰으로 보므로)</text>
<text x="380" y="182" font-size="12" fill="#222" text-anchor="start" font-weight="normal">· 헤더에 「원격 · 어느 방」 표시</text>
<text x="380" y="206" font-size="12" fill="#222" text-anchor="start" font-weight="normal">· 고객 말 → 한국어 음성이 이 기기에서</text>
<text x="380" y="230" font-size="12" fill="#222" text-anchor="start" font-weight="normal">· 직원 말 → 고객 언어 음성이 고객 폰에서</text>
<text x="380" y="254" font-size="12" fill="#222" text-anchor="start" font-weight="normal"></text>
<text x="380" y="278" font-size="12" fill="#222" text-anchor="start" font-weight="normal">열린 것(선택지):</text>
<text x="380" y="302" font-size="12" fill="#222" text-anchor="start" font-weight="normal">· 외국어 영역 — 고객 화면 미러(그림) / 없앰</text>
<text x="380" y="326" font-size="12" fill="#222" text-anchor="start" font-weight="normal">   (한국어 영역만 남김)</text>
<text x="380" y="350" font-size="12" fill="#222" text-anchor="start" font-weight="normal">· 한 번에 고객 한 명 — 다른 방 고객이 말하면?</text>
<text x="380" y="374" font-size="12" fill="#222" text-anchor="start" font-weight="normal">   받지 않음 / 알림만 띄움</text>
</svg>
