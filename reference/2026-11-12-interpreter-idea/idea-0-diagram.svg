<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="AppleGothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title>0단계 모식도 — 마주 보고 통역(기기 1대)</title>
<defs><marker id="ah222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ah2498bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2498bd"/></marker><marker id="ah7a5bd6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5bd6"/></marker></defs>
<rect width="900" height="420" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#222" text-anchor="start" font-weight="bold">0 · 지금 — 한 공간에서 마주 보고, 기기 1대</text>
<rect x="24" y="60" width="560" height="330" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="40" y="84" font-size="12" fill="#666" text-anchor="start" font-weight="normal">상담 공간(예시)</text>
<rect x="40" y="200" width="110" height="70" rx="8" fill="#e3f3f8" stroke="#2498bd" stroke-width="1.2"/>
<text x="95" y="228" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">직원</text>
<text x="95" y="244" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">한국어로 말하고 들음</text>
<rect x="245" y="170" width="90" height="130" rx="12" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="290" y="205" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">통키</text>
<text x="290" y="221" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">기기 1대</text>
<text x="290" y="237" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">(폰·태블릿)</text>
<text x="290" y="253" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">마이크 1</text>
<rect x="430" y="200" width="140" height="70" rx="8" fill="#efeafb" stroke="#7a5bd6" stroke-width="1.2"/>
<text x="500" y="228" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">고객</text>
<text x="500" y="244" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">외국어로 말하고 들음</text>
<line x1="152" y1="222" x2="243" y2="222" stroke="#2498bd" stroke-width="1.8" marker-end="url(#ah2498bd)"/>
<text x="197.5" y="214" font-size="11" fill="#2498bd" text-anchor="middle" font-weight="normal">말</text>
<line x1="243" y1="250" x2="152" y2="250" stroke="#2498bd" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah2498bd)"/>
<text x="197.5" y="268" font-size="10" fill="#2498bd" text-anchor="middle" font-weight="normal">한국어 자막·음성</text>
<line x1="428" y1="222" x2="337" y2="222" stroke="#7a5bd6" stroke-width="1.8" marker-end="url(#ah7a5bd6)"/>
<text x="382.5" y="214" font-size="11" fill="#7a5bd6" text-anchor="middle" font-weight="normal">말</text>
<line x1="337" y1="250" x2="428" y2="250" stroke="#7a5bd6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah7a5bd6)"/>
<text x="382.5" y="268" font-size="10" fill="#7a5bd6" text-anchor="middle" font-weight="normal">외국어 자막·음성</text>
<text x="290" y="340" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">화면 위쪽 절반이 180° 뒤집혀 맞은편 고객이 읽는다</text>
<rect x="640" y="80" width="220" height="96" rx="8" fill="#eef0f3" stroke="#666" stroke-width="1.2"/>
<text x="750.0" y="104" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">통키 서버</text>
<text x="750.0" y="126" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">말 받기 → 받아쓰기 · 번역</text>
<text x="750.0" y="142" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">→ 번역 음성 만들기</text>
<line x1="300" y1="168" x2="638" y2="118" stroke="#222" stroke-width="1.8" marker-end="url(#ah222)"/>
<text x="470" y="124" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">두 사람의 말(마이크 하나)</text>
<line x1="638" y1="150" x2="337" y2="182" stroke="#222" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah222)"/>
<text x="488" y="190" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">자막 + 번역 음성(같은 기기로)</text>
<line x1="620" y1="300" x2="654" y2="300" stroke="#222" stroke-width="1.8" marker-end="url(#ah222)"/>
<text x="664" y="304" font-size="11" fill="#666" text-anchor="start" font-weight="normal">음성 보냄</text>
<line x1="620" y1="320" x2="654" y2="320" stroke="#222" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah222)"/>
<text x="664" y="324" font-size="11" fill="#666" text-anchor="start" font-weight="normal">자막·음성 돌려받음</text>
</svg>
