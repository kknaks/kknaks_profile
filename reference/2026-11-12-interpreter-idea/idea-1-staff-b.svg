<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="AppleGothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title>1단계 직원 화면 선택지 B — 여러 방 콘솔</title>
<defs></defs>
<rect width="900" height="520" fill="#ffffff"/>
<text x="24" y="30" font-size="15" fill="#222" text-anchor="start" font-weight="bold">1단계 · 직원 화면 선택지 B — 여러 방 콘솔(태블릿 · PC)</text>
<rect x="24" y="50" width="850" height="400" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="24" y="50" width="850" height="36" rx="10" fill="#f4f5f7" stroke="#222" stroke-width="2"/>
<text x="38" y="74" font-size="13" fill="#2498bd" text-anchor="start" font-weight="bold">≡  Tongky — 여러 방 콘솔</text>
<line x1="274" y1="86" x2="274" y2="450" stroke="#ddd"/>
<rect x="34" y="96" width="230" height="58" rx="8" fill="#e3f3f8" stroke="#2498bd" stroke-width="1.2"/>
<text x="46" y="118" font-size="12" fill="#222" text-anchor="start" font-weight="bold">상담실(예시)</text>
<text x="46" y="138" font-size="10" fill="#666" text-anchor="start" font-weight="normal">English · 대화 중</text>
<rect x="34" y="162" width="230" height="58" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.2"/>
<text x="46" y="184" font-size="12" fill="#222" text-anchor="start" font-weight="bold">시술실(예시)</text>
<text x="46" y="204" font-size="10" fill="#666" text-anchor="start" font-weight="normal">日本語 · 새 말</text>
<rect x="194" y="172" width="60" height="20" rx="10" fill="#fdf1e4" stroke="#d9822b" stroke-width="1.2"/>
<text x="224" y="186" font-size="9" fill="#d9822b" text-anchor="middle" font-weight="normal">새 말</text>
<rect x="34" y="228" width="230" height="58" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.2"/>
<text x="46" y="250" font-size="12" fill="#222" text-anchor="start" font-weight="bold">대기 공간(예시)</text>
<text x="46" y="270" font-size="10" fill="#666" text-anchor="start" font-weight="normal">中文 · 조용함</text>
<text x="290" y="112" font-size="13" fill="#222" text-anchor="start" font-weight="bold">상담실(예시) · English</text>
<rect x="290" y="126" width="426.0" height="25" rx="10" fill="#f4f5f7" stroke="#f4f5f7" stroke-width="1.2"/>
<text x="300" y="142" font-size="11" fill="#222" text-anchor="start" font-weight="normal">화장실이 어디예요? (Where is the restroom?)</text>
<rect x="432.0" y="160" width="426.0" height="25" rx="10" fill="#2498bd" stroke="#2498bd" stroke-width="1.2"/>
<text x="442.0" y="176" font-size="11" fill="#fff" text-anchor="start" font-weight="normal">복도 끝 왼쪽이에요.</text>
<circle cx="574.0" cy="390" r="26" fill="#2498bd"/>
<text x="574.0" y="432" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">말하면 고른 방으로만 갑니다(예시)</text>
<text x="624.0" y="394" font-size="10" fill="#c0392b" text-anchor="start" font-weight="normal">말하기 방식: 자동 듣기 / 누르고 말하기 — 선택지</text>
<text x="24" y="478" font-size="11" fill="#666" text-anchor="start" font-weight="normal">· 왼쪽 = QR 로 들어온 방(또는 고객) 목록 · 새 말이 오면 표시  · 오른쪽 = 고른 방의 대화(한국어 + 원문 작게)</text>
<text x="24" y="496" font-size="11" fill="#666" text-anchor="start" font-weight="normal">· 말은 고른 방으로(예시) · 말하기 방식(자동 듣기 / 누르고 말하기)과 다른 방 말을 소리로 · 글로만 띄울지는 열린 것(의료 p11)</text>
</svg>
