<svg xmlns="http://www.w3.org/2000/svg" width="700" height="640" viewBox="0 0 700 640" font-family="AppleGothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title>1단계 고객 화면 목업(QR) — 입장 · 대화</title>
<defs></defs>
<rect width="700" height="640" fill="#ffffff"/>
<text x="24" y="30" font-size="15" fill="#222" text-anchor="start" font-weight="bold">1단계 · 고객 화면(QR 로 열림) — 예시 문장은 가짜</text>
<rect x="40" y="60" width="260" height="520" rx="22" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="50" y="74" width="240" height="492" rx="12" fill="#f4f5f7" stroke="#f4f5f7" stroke-width="1.2"/>
<text x="170.0" y="602" font-size="13" fill="#666" text-anchor="middle" font-weight="bold">① QR 찍은 직후 — 언어 고르기</text>
<text x="170" y="130" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Choose your language</text>
<rect x="60" y="150" width="104" height="50" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
<text x="112.0" y="180" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">English</text>
<rect x="176" y="150" width="104" height="50" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
<text x="228.0" y="180" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">日本語</text>
<rect x="60" y="212" width="104" height="50" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
<text x="112.0" y="242" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">中国 · 简体中文</text>
<rect x="176" y="212" width="104" height="50" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
<text x="228.0" y="242" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">臺灣 · 繁體中文</text>
<rect x="60" y="274" width="104" height="50" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
<text x="112.0" y="304" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">ไทย</text>
<rect x="176" y="274" width="104" height="50" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
<text x="228.0" y="304" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">Tiếng Việt</text>
<rect x="60" y="336" width="220" height="50" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
<text x="170.0" y="366" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">廣東話</text>
<text x="170" y="440" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">No app · No sign-up</text>
<text x="170" y="460" font-size="10" fill="#666" text-anchor="middle" font-weight="normal">(설치 · 가입 없음)</text>
<rect x="380" y="60" width="260" height="520" rx="22" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="390" y="74" width="240" height="492" rx="12" fill="#f4f5f7" stroke="#f4f5f7" stroke-width="1.2"/>
<text x="404" y="104" font-size="13" fill="#2498bd" text-anchor="start" font-weight="bold">Tongky</text>
<text x="616" y="104" font-size="10" fill="#666" text-anchor="end" font-weight="normal">English ▾</text>
<rect x="400" y="118" width="220" height="342" rx="10" fill="#fff" stroke="#ddd" stroke-width="1.2"/>
<rect x="408" y="128" width="153.0" height="24" rx="10" fill="#f4f5f7" stroke="#f4f5f7" stroke-width="1.2"/>
<text x="418" y="143" font-size="10" fill="#222" text-anchor="start" font-weight="normal">Please let me know if it hurts.</text>
<rect x="459.0" y="160" width="153.0" height="24" rx="10" fill="#7a5bd6" stroke="#7a5bd6" stroke-width="1.2"/>
<text x="469.0" y="175" font-size="10" fill="#fff" text-anchor="start" font-weight="normal">Where is the restroom?</text>
<circle cx="510" cy="500" r="26" fill="#7a5bd6"/>
<text x="510" y="546" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">● Please speak</text>
<text x="510" y="604" font-size="13" fill="#666" text-anchor="middle" font-weight="bold">② 대화 — 고객 언어 자막만 · 뒤집힘 없음</text>
</svg>
