<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" font-family="AppleGothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title>1단계 QR 자리 선택지 — A 방에 고정 / B 직원 화면에 띄움</title>
<defs><marker id="ah7a5bd6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5bd6"/></marker></defs>
<rect width="940" height="360" fill="#ffffff"/>
<text x="24" y="32" font-size="16" fill="#222" text-anchor="start" font-weight="bold">QR 을 어디에 두나 — 선택지 (결정 아님)</text>
<rect x="24" y="52" width="440" height="280" rx="8" fill="#fafafa" stroke="#d9822b" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="40" y="80" font-size="14" fill="#d9822b" text-anchor="start" font-weight="bold">A · 방에 고정 QR</text>
<text x="40" y="108" font-size="12" fill="#222" text-anchor="start" font-weight="normal">방마다 QR 판 하나(예: 벽 · 테이블)</text>
<text x="40" y="125" font-size="12" fill="#222" text-anchor="start" font-weight="normal">고객이 찍으면 「그 방」 대화로 들어감</text>
<text x="40" y="142" font-size="12" fill="#222" text-anchor="start" font-weight="normal">직원 화면에는 방 이름으로 보임</text>
<rect x="64" y="180" width="110" height="110" rx="8" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="119" y="240" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">▦ QR</text>
<text x="119" y="306" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">방 벽의 QR 판</text>
<rect x="284" y="170" width="80" height="130" rx="12" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="324" y="240" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">고객 폰</text>
<line x1="282" y1="235" x2="176" y2="235" stroke="#7a5bd6" stroke-width="1.8" marker-end="url(#ah7a5bd6)"/>
<text x="229.0" y="226" font-size="11" fill="#7a5bd6" text-anchor="middle" font-weight="normal">찍기</text>
<text x="40" y="324" font-size="11" fill="#666" text-anchor="start" font-weight="normal">이어지는 것: 방 / 끝나는 때: 방을 나갈 때?</text>
<rect x="484" y="52" width="440" height="280" rx="8" fill="#fafafa" stroke="#d9822b" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="500" y="80" font-size="14" fill="#d9822b" text-anchor="start" font-weight="bold">B · 직원 화면에 그때그때 QR</text>
<text x="500" y="108" font-size="12" fill="#222" text-anchor="start" font-weight="normal">직원이 「원격 시작」을 누르면 QR 이 뜸</text>
<text x="500" y="125" font-size="12" fill="#222" text-anchor="start" font-weight="normal">고객이 자기 폰으로 찍고 방으로 이동</text>
<text x="500" y="142" font-size="12" fill="#222" text-anchor="start" font-weight="normal">직원 화면에는 고객(대화)으로 보임</text>
<rect x="524" y="170" width="130" height="130" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="589" y="200" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">직원 화면</text>
<text x="589" y="250" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">▦ QR</text>
<rect x="764" y="170" width="80" height="130" rx="12" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="804" y="240" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">고객 폰</text>
<line x1="762" y1="235" x2="656" y2="235" stroke="#7a5bd6" stroke-width="1.8" marker-end="url(#ah7a5bd6)"/>
<text x="709.0" y="226" font-size="11" fill="#7a5bd6" text-anchor="middle" font-weight="normal">찍기</text>
<text x="500" y="324" font-size="11" fill="#666" text-anchor="start" font-weight="normal">이어지는 것: 고객 / 끝나는 때: 직원이 닫을 때?</text>
</svg>
