<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" font-family="AppleGothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title>1단계 모식도 — 통역 + 원격 통역(QR = 고객 화면)</title>
<defs><marker id="ah222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ah2498bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2498bd"/></marker><marker id="ah7a5bd6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5bd6"/></marker></defs>
<rect width="1100" height="480" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#222" text-anchor="start" font-weight="bold">1단계 — 고객은 방에서 말하고, 직원은 로비에서 듣고 답한다</text>
<rect x="24" y="70" width="320" height="330" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="40" y="94" font-size="12" fill="#666" text-anchor="start" font-weight="normal">방(예: 상담실 · 시술실 · 대기 공간)</text>
<rect x="44" y="150" width="110" height="60" rx="8" fill="#efeafb" stroke="#7a5bd6" stroke-width="1.2"/>
<text x="99" y="175" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">고객</text>
<text x="99" y="192" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">외국어로 말함</text>
<rect x="200" y="120" width="120" height="150" rx="14" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="260" y="150" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">고객 폰</text>
<text x="260" y="166" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">= 고객 화면</text>
<text x="260" y="182" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">(QR 로 열림)</text>
<text x="260" y="198" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">앱 설치 없음</text>
<line x1="156" y1="168" x2="198" y2="168" stroke="#7a5bd6" stroke-width="1.8" marker-end="url(#ah7a5bd6)"/>
<line x1="198" y1="192" x2="156" y2="192" stroke="#7a5bd6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah7a5bd6)"/>
<rect x="44" y="296" width="280" height="84" rx="8" fill="#fff" stroke="#d9822b" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="58" y="320" font-size="11" fill="#d9822b" text-anchor="start" font-weight="normal">QR — 찍으면 고객 폰이 고객 화면이 된다</text>
<text x="58" y="336" font-size="11" fill="#d9822b" text-anchor="start" font-weight="normal">어디에 두나는 선택지(아래 그림)</text>
<text x="58" y="352" font-size="11" fill="#d9822b" text-anchor="start" font-weight="normal">A 방에 고정 · B 직원 화면에 그때그때</text>
<rect x="440" y="140" width="220" height="110" rx="8" fill="#eef0f3" stroke="#666" stroke-width="1.2"/>
<text x="550.0" y="164" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">통키 서버</text>
<text x="550.0" y="186" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">고객 말 → 한국어로</text>
<text x="550.0" y="202" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">직원 말 → 고객 언어로</text>
<text x="550.0" y="218" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">음성은 듣는 쪽 기기로</text>
<rect x="756" y="70" width="320" height="330" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="772" y="94" font-size="12" fill="#666" text-anchor="start" font-weight="normal">로비 · 데스크</text>
<rect x="780" y="120" width="120" height="150" rx="14" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="840" y="150" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">직원 기기</text>
<text x="840" y="166" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">= 직원 화면</text>
<text x="840" y="182" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">(선택지 A / B)</text>
<rect x="944" y="150" width="116" height="60" rx="8" fill="#e3f3f8" stroke="#2498bd" stroke-width="1.2"/>
<text x="1002" y="175" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">직원</text>
<text x="1002" y="192" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">한국어로 듣고 답함</text>
<line x1="942" y1="168" x2="902" y2="168" stroke="#2498bd" stroke-width="1.8" marker-end="url(#ah2498bd)"/>
<line x1="902" y1="192" x2="942" y2="192" stroke="#2498bd" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah2498bd)"/>
<rect x="780" y="296" width="280" height="84" rx="8" fill="#fff" stroke="#999" stroke-width="1.2"/>
<text x="796" y="320" font-size="11" fill="#666" text-anchor="start" font-weight="normal">마주 보고 통역(0단계)도 그대로 —</text>
<text x="796" y="336" font-size="11" fill="#666" text-anchor="start" font-weight="normal">직원 기기 하나로 앞에 온 고객과도</text>
<line x1="322" y1="170" x2="438" y2="170" stroke="#7a5bd6" stroke-width="1.8" marker-end="url(#ah7a5bd6)"/>
<text x="380.0" y="162" font-size="11" fill="#7a5bd6" text-anchor="middle" font-weight="normal">고객 말</text>
<line x1="438" y1="222" x2="322" y2="222" stroke="#7a5bd6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah7a5bd6)"/>
<text x="380.0" y="242" font-size="11" fill="#7a5bd6" text-anchor="middle" font-weight="normal">자막 · 음성</text>
<line x1="662" y1="170" x2="778" y2="170" stroke="#2498bd" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah2498bd)"/>
<text x="720.0" y="162" font-size="11" fill="#2498bd" text-anchor="middle" font-weight="normal">자막 · 음성</text>
<line x1="778" y1="222" x2="662" y2="222" stroke="#2498bd" stroke-width="1.8" marker-end="url(#ah2498bd)"/>
<text x="720.0" y="242" font-size="11" fill="#2498bd" text-anchor="middle" font-weight="normal">직원 말</text>
<line x1="420" y1="310" x2="454" y2="310" stroke="#7a5bd6" stroke-width="1.8" marker-end="url(#ah7a5bd6)"/>
<text x="464" y="314" font-size="11" fill="#666" text-anchor="start" font-weight="normal">고객 쪽(고객 언어)</text>
<line x1="420" y1="330" x2="454" y2="330" stroke="#2498bd" stroke-width="1.8" marker-end="url(#ah2498bd)"/>
<text x="464" y="334" font-size="11" fill="#666" text-anchor="start" font-weight="normal">직원 쪽(한국어)</text>
<line x1="420" y1="350" x2="454" y2="350" stroke="#222" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah222)"/>
<text x="464" y="354" font-size="11" fill="#666" text-anchor="start" font-weight="normal">점선 = 돌려받는 자막 · 음성</text>
<text x="24" y="446" font-size="12" fill="#666" text-anchor="start" font-weight="normal">※ 지금 통키는 한 대화 = 기기 1대 · 마이크 1. 1단계는 한 대화에 기기 2대(고객 폰 + 직원 기기)가 붙는다.</text>
</svg>
