<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" font-family="AppleGothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<title>0단계 화면 목업 — 지금 통키 통역 화면(코드 main 17c26b5 기준)</title>
<defs><marker id="ah999" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker></defs>
<rect width="800" height="620" fill="#ffffff"/>
<text x="24" y="30" font-size="15" fill="#222" text-anchor="start" font-weight="bold">0 · 지금 통키 통역 화면 (코드 기준 · 예시 문장은 가짜)</text>
<rect x="40" y="50" width="300" height="540" rx="22" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="50" y="64" width="280" height="512" rx="12" fill="#f4f5f7" stroke="#f4f5f7" stroke-width="1.2"/>
<text x="190.0" y="612" font-size="13" fill="#666" text-anchor="middle" font-weight="bold">통역 화면</text>
<text x="66" y="96" font-size="14" fill="#2498bd" text-anchor="start" font-weight="bold">≡  Tongky</text>
<rect x="62" y="112" width="256" height="170" rx="10" fill="#fff" stroke="#ddd" stroke-width="1.2"/>
<g transform="rotate(180 190 197)">
<rect x="72" y="122" width="120" height="30" rx="6" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
<text x="82" y="142" font-size="12" fill="#222" text-anchor="start" font-weight="normal">English ▾</text>
<rect x="268" y="122" width="36" height="30" rx="6" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
<text x="286" y="142" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">⟳</text>
<rect x="72" y="166" width="177.0" height="25" rx="10" fill="#f4f5f7" stroke="#f4f5f7" stroke-width="1.2"/>
<text x="82" y="182" font-size="11" fill="#222" text-anchor="start" font-weight="normal">Please let me know if it hurts.</text>
<rect x="131.0" y="200" width="177.0" height="25" rx="10" fill="#7a5bd6" stroke="#7a5bd6" stroke-width="1.2"/>
<text x="141.0" y="216" font-size="11" fill="#fff" text-anchor="start" font-weight="normal">Okay, I will.</text>
</g>
<text x="190" y="302" font-size="11" fill="#666" text-anchor="middle" font-weight="normal" transform="rotate(180 190 298.3)">● Please speak</text>
<circle cx="190" cy="340" r="28" fill="#7a5bd6"/>
<rect x="64" y="320" width="60" height="40" rx="6" fill="#e6e6e6" stroke="#e6e6e6" stroke-width="1.2"/>
<text x="94" y="336" font-size="8" fill="#222" text-anchor="middle" font-weight="normal">자동 듣기</text>
<text x="94" y="348" font-size="8" fill="#222" text-anchor="middle" font-weight="normal">누르고 말하기</text>
<text x="190" y="386" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">말씀하세요</text>
<rect x="62" y="400" width="256" height="160" rx="10" fill="#fff" stroke="#ddd" stroke-width="1.2"/>
<rect x="131.0" y="412" width="177.0" height="25" rx="10" fill="#2498bd" stroke="#2498bd" stroke-width="1.2"/>
<text x="141.0" y="428" font-size="11" fill="#fff" text-anchor="start" font-weight="normal">아프면 말씀해 주세요.</text>
<rect x="72" y="446" width="177.0" height="25" rx="10" fill="#f4f5f7" stroke="#f4f5f7" stroke-width="1.2"/>
<text x="82" y="462" font-size="11" fill="#222" text-anchor="start" font-weight="normal">네, 그럴게요.</text>
<text x="380" y="100" font-size="13" fill="#222" text-anchor="start" font-weight="bold">① 헤더</text>
<text x="490" y="100" font-size="12" fill="#666" text-anchor="start" font-weight="normal">햄버거(로그아웃) · 워드마크</text>
<text x="380" y="134" font-size="13" fill="#222" text-anchor="start" font-weight="bold">② 외국어 영역</text>
<text x="490" y="134" font-size="12" fill="#666" text-anchor="start" font-weight="normal">기본 180° 뒤집힘 — 맞은편 고객이 읽음</text>
<text x="380" y="168" font-size="13" fill="#222" text-anchor="start" font-weight="bold"></text>
<text x="490" y="168" font-size="12" fill="#666" text-anchor="start" font-weight="normal">언어 드롭다운 · 화면 방향 단추 · 말풍선</text>
<text x="380" y="202" font-size="13" fill="#222" text-anchor="start" font-weight="bold">③ 가운데 줄</text>
<text x="490" y="202" font-size="12" fill="#666" text-anchor="start" font-weight="normal">원 위 = 고른 언어 안내(뒤집힘)</text>
<text x="380" y="236" font-size="13" fill="#222" text-anchor="start" font-weight="bold"></text>
<text x="490" y="236" font-size="12" fill="#666" text-anchor="start" font-weight="normal">원 = 음량 따라 커짐 · 누르면 멈춤</text>
<text x="380" y="270" font-size="13" fill="#222" text-anchor="start" font-weight="bold"></text>
<text x="490" y="270" font-size="12" fill="#666" text-anchor="start" font-weight="normal">왼쪽 = 듣기 방식(자동 / 누르고 말하기)</text>
<text x="380" y="304" font-size="13" fill="#222" text-anchor="start" font-weight="bold"></text>
<text x="490" y="304" font-size="12" fill="#666" text-anchor="start" font-weight="normal">원 아래 = 한국어 안내 · 멈춤 때 「초기화」</text>
<text x="380" y="338" font-size="13" fill="#222" text-anchor="start" font-weight="bold"></text>
<text x="490" y="338" font-size="12" fill="#666" text-anchor="start" font-weight="normal">번역 음성은 이 기기 스피커로</text>
<text x="380" y="372" font-size="13" fill="#222" text-anchor="start" font-weight="bold">④ 한국어 영역</text>
<text x="490" y="372" font-size="12" fill="#666" text-anchor="start" font-weight="normal">직원이 읽음 · 내 말 오른쪽 / 상대 말 왼쪽</text>
<text x="380" y="406" font-size="13" fill="#222" text-anchor="start" font-weight="bold">⑤ 시작 전</text>
<text x="490" y="406" font-size="12" fill="#666" text-anchor="start" font-weight="normal">화면 전체 언어 단추 — 누르는 것이 시작</text>
<line x1="370" y1="95" x2="262" y2="92" stroke="#999" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah999)"/>
<line x1="370" y1="129" x2="318" y2="190" stroke="#999" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah999)"/>
<line x1="370" y1="197" x2="222" y2="340" stroke="#999" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah999)"/>
<line x1="370" y1="367" x2="318" y2="470" stroke="#999" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah999)"/>
</svg>
