<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CC 데모 변경 목업 — 데스크 · 원장 · 간호사</title>
<style>
:root{--ac:#4396bd;--acd:#2f7fa6;--acl:#eaf4f9;--bg:#f7f7f8;--ink:#2b2b2e;--mute:#8a8a90;--line:#e7e7ea;
 --wait:#fdf6ea;--waitb:#efd9b0;--cons:#f4effd;--consb:#c9b5f2;--proc:#eaf4fb;--procb:#a9cfe6;--warn:#fdecec;--warnb:#f0b4b4;--chg:#e07a1f}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer}
.mockbar{background:#26262a;color:#ddd;display:flex;align-items:center;gap:14px;padding:8px 20px;font-size:13px}
.mockbar .roles button{background:#3a3a40;color:#ddd;border:0;border-radius:6px;padding:5px 12px;margin-right:4px}
.mockbar .roles button.on{background:#fff;color:#111;font-weight:600}
.mockbar label{display:flex;gap:6px;align-items:center;margin-left:auto}
.mockbar .lg{display:inline-flex;align-items:center;gap:6px}
.mockbar .lg i{display:inline-block;width:22px;height:12px;border:2px dashed var(--chg);border-radius:3px}
header.app{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;height:56px;gap:28px}
.logo{font-family:"Didot","Times New Roman",serif;font-size:20px;letter-spacing:.5px}
header.app .nav{color:var(--ac);font-weight:600}
header.app .r{margin-left:auto;display:flex;gap:16px;color:var(--mute)}
header.app .r b{color:var(--ink);font-weight:600}
.view{display:none}.view.on{display:block}
/* change highlight */
.imp{outline:2px dashed var(--chg);outline-offset:3px;border-radius:8px;position:relative}
.imptag{position:absolute;top:-11px;right:6px;background:var(--chg);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;z-index:3;white-space:nowrap}
body.nohl .imp{outline:none}body.nohl .imptag{display:none}
/* desk */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.board{padding:16px}
.board h1{font-size:20px;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.board h1 small{font-size:13px;color:var(--mute);font-weight:400}
.rooms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.room{border:1px solid var(--line);border-radius:10px;min-height:96px;padding:10px;background:#fff}
.room .rn{font-size:13px;font-weight:600}
.room.empty .rn{color:#b8b8be;font-weight:500}
.room.empty .sub{color:#b8b8be}
.room.wait{background:var(--wait);border-color:var(--waitb)}
.room.cons{background:var(--cons);border-color:var(--consb)}
.room.proc{background:var(--proc);border-color:var(--procb)}
.room .sub{font-size:12px;color:var(--mute);margin-top:3px}
.room .tm{font-size:12px;color:#a0632a;margin-top:2px}
.pname{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:2px 0;font-weight:600;color:var(--ink);text-align:left}
.pname:before{content:"";width:7px;height:7px;border-radius:50%;background:#333}
.pname:hover{color:var(--ac);text-decoration:underline}
.pname small{font-weight:400;color:var(--mute)}
.room .pname{flex-wrap:wrap;row-gap:0}.room .pname small{flex-basis:100%;margin-left:12px;font-size:12px}
.side{display:flex;flex-direction:column;min-height:640px}
.search{padding:12px 14px 0;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;background:var(--bg)}
.sres{position:absolute;left:14px;right:14px;top:52px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.1);z-index:20;display:none}
.sres div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sres div:hover{background:var(--acl)}
.sres small{color:var(--mute)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:10px 14px 0}
.tabs button{flex:1;border:0;background:none;padding:10px 0;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.tabpane{display:none;padding:12px 14px;overflow:auto}.tabpane.on{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;text-align:left}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-size:18px}
.stat.on{border-color:var(--ac);background:var(--acl)}
.stat.late b{color:#c94a4a}
.rlist .row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.row{align-items:flex-start}.row .t{padding-top:2px;width:42px;color:var(--mute);font-variant-numeric:tabular-nums}
.row .n{flex:1;min-width:0}
.row .n .pname:before{display:none}
.row .meta{font-size:12px;color:var(--mute)}
.row .late{color:#c94a4a;font-size:12px}
.badge{font-size:11px;padding:1px 6px;border-radius:6px;background:#eef1f3;color:#555;margin-left:4px;font-weight:500}
.badge.first{background:var(--acl);color:var(--acd)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--acd)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.warn{border-color:#d66;color:#c33}
.done{color:var(--mute)}
/* staff tab */
.ai{border:1px solid var(--consb);background:var(--cons);border-radius:10px;padding:12px;margin-bottom:12px}
.ai .h{font-size:12px;color:#7a5ac8;font-weight:700;margin-bottom:4px}
.ai p{margin:0 0 8px;line-height:1.5}
.staff{padding:10px 0;border-bottom:1px solid var(--line)}
.staff .nm{font-weight:600}.staff .nm small{color:var(--mute);font-weight:400;margin-left:4px}
.staff .ln{font-size:13px;margin-top:3px;display:flex;gap:8px;align-items:center}
.staff .ln b{color:var(--ac);font-weight:500;width:28px}
.staff select{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:6px}
/* drawer & modal */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40}
.dim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:#fff;z-index:41;transform:translateX(100%);transition:transform .2s;overflow:auto;padding:22px}
.drawer.on{transform:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:26px;z-index:41;display:none}
.modal.on{display:block}
.x{float:right;border:0;background:none;font-size:20px;color:var(--mute)}
.who{font-size:22px;font-weight:700}
.who small{font-size:14px;color:var(--mute);font-weight:400;margin-left:6px}
.idline{color:var(--mute);margin:4px 0 14px}
.idline b{color:var(--ink);font-weight:500}
.sec{margin-top:16px}
.sec h4{margin:0 0 8px;font-size:13px;color:#555}
.caut{display:flex;flex-wrap:wrap;gap:6px}
.caut span{background:var(--warn);border:1px solid var(--warnb);color:#a33;border-radius:6px;padding:3px 8px;font-size:13px}
.steps .st{display:flex;gap:10px;align-items:center;padding:7px 0}
.steps .no{width:22px;height:22px;border-radius:50%;border:1px solid #ccc;font-size:12px;display:flex;align-items:center;justify-content:center;color:#888}
.steps .st.cur .no{border-color:var(--ac);color:var(--ac);font-weight:700}
.steps .st.ok .no{background:#e9e9ec;border-color:#e9e9ec}
.steps .st .s{font-size:12px;color:var(--mute)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;font-size:13px}
.opt.on{border-color:var(--ac);background:var(--acl);color:var(--acd);font-weight:600}
.opt small{color:var(--mute);font-weight:400}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.chk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.chk.on{border-color:var(--ac);background:var(--acl)}
.chk .r{margin-left:auto;font-size:12px;color:var(--mute);text-align:right}
.chk .r em{font-style:normal;color:var(--acd)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:#eef1f3;border-radius:6px;padding:4px 8px;font-size:13px;margin:0 6px 6px 0}
.tag button{border:0;background:none;color:#999;padding:0}
textarea,select.full{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}
.hist{background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.6}
.hist b{font-weight:600}
/* staff screens */
.staffv{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;padding:16px 20px}
.lst{padding:14px}
.lst h3{margin:0 0 2px;font-size:17px}
.lst .cnt{color:var(--mute);font-size:13px;margin-bottom:8px}
.grp{font-size:12px;color:var(--mute);margin:12px 0 4px;font-weight:600}
.pi{border-radius:10px;padding:10px 12px;cursor:pointer;border:1px solid transparent}
.pi:hover{background:var(--bg)}
.pi.sel{background:var(--acl)}
.pi .l1{display:flex;justify-content:space-between;align-items:center}
.pi .l1 b{font-weight:600}
.pi .l2{font-size:13px;margin-top:3px}
.pi .l3{font-size:12px;color:#b04848;margin-top:2px}
.pill{font-size:11px;border-radius:10px;padding:1px 8px}
.pill.ing{background:var(--proc);color:#2f7fa6}.pill.wait{background:var(--wait);color:#a0632a}.pill.ok{background:#eee;color:#888}.pill.ane{background:#fdf0e6;color:#c26a1f}
.det{padding:20px}
.det .top{display:flex;justify-content:space-between;align-items:flex-start}
.trt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.trt .nm{flex:1}
.trt .nm small{display:block;color:var(--mute);font-size:12px}
.mis{font-size:11px;background:var(--warn);color:#b33;border:1px solid var(--warnb);border-radius:6px;padding:1px 6px;margin-left:6px}
.fold{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--mute)}
.fold ul{margin:6px 0 0;padding-left:18px}
.next{display:flex;gap:12px;align-items:center;background:var(--acl);border-radius:10px;padding:12px 14px}
.next b{font-size:15px}
.memo{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px;line-height:1.55;white-space:pre-line}
.memo .h{color:var(--mute);font-size:12px;margin-bottom:2px}
.memoin{display:flex;gap:6px}.memoin input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.prep .chk{cursor:default}
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#e9a35c}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#26262a;color:#fff;padding:11px 18px;border-radius:10px;z-index:60;display:none;font-size:14px}
.alert{background:var(--warn);border:1px solid var(--warnb);border-radius:10px;padding:12px;margin-top:12px;line-height:1.55;display:none}
.alert.on{display:block}
.amt{display:flex;gap:8px;align-items:center;margin-top:8px}
.amt input{width:80px;border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit}

.contact{margin-top:6px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.contact a.btn{text-decoration:none;color:var(--ink)}
.vip{font-size:11px;font-weight:700;color:#8a5a00;background:#fff3cf;border:1px solid #f0d27a;border-radius:6px;padding:1px 6px;margin-left:4px}
.chip{display:inline-block;font-size:12px;background:#eef1f3;border-radius:6px;padding:2px 8px;margin:4px 4px 0 0}
.chip.red{background:var(--warn);color:#a33}
.chip.big{font-size:14px;padding:5px 10px;background:var(--acl);color:var(--acd);font-weight:600}
.ccard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.ccard:hover{border-color:var(--ac)}
.ccard.wait{border-left:4px solid var(--waitb)}.ccard.cons{border-left:4px solid var(--consb)}.ccard.proc{border-left:4px solid var(--procb)}
.ccard .l1{display:flex;align-items:center;gap:6px}.ccard .l1 b{font-size:15px}.ccard .l1 small{color:var(--mute)}
.ccard .l2{font-size:13px;margin-top:4px}.ccard .loc{font-weight:600}
.warnTxt{color:#c94a4a;font-weight:600}
.nowbox{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 12px;background:var(--bg);margin-top:10px}
.nowbox b{font-size:15px}
.movebox{margin-top:18px;padding:12px;border-radius:10px;background:#fafbfc}
.movebox .mh{font-weight:700}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px}
.sc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.sc.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--acl)}
.sc.nx{background:var(--acl)}
.sc .k{font-size:12px;color:var(--mute);font-weight:600}
.sc .rm{font-size:22px;font-weight:700;margin:2px 0 4px}
.sc .rdy{font-size:12px;font-weight:600;color:#c26a1f;margin-left:6px}
.caut.sm span{font-size:12px;padding:2px 6px;margin-top:6px}
.caut .none{background:none;border:0;color:var(--mute)}
.room-s{font-weight:700;font-size:13px}
.ht{border-collapse:collapse;width:100%;font-size:13px}.ht th,.ht td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}.ht th{color:var(--mute);font-weight:500}
.trt.prep .nm{color:var(--mute)}

.callbar{display:flex;gap:6px;align-items:center;padding:8px;border-radius:10px;background:var(--bg);margin-bottom:14px}
.nowtask{border:1px solid var(--ac);background:var(--acl);border-radius:12px;padding:14px 16px}
.nowtask .k{font-size:12px;color:var(--mute);font-weight:600}
.nowtask .rm{font-size:24px;font-weight:700;margin:2px 0}
.nowtask .rdy{font-size:13px;font-weight:600;color:#c26a1f;margin-left:6px}
.nowtask .t1{font-size:15px;font-weight:600}
.order{margin-top:8px;border:1px dashed #c9c9cf;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55}
.order .h{font-size:12px;color:var(--mute);font-weight:600}

.legend{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400;display:inline-flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid}
.legend .lw{background:var(--wait);border-color:var(--waitb)}.legend .lc{background:var(--cons);border-color:var(--consb)}.legend .la{background:#fdf0e6;border-color:#efc39a}.legend .lp{background:var(--proc);border-color:var(--procb)}
.room.ane{background:#fdf0e6;border-color:#efc39a}
.btn.int{font-size:12px;padding:3px 9px;border-color:var(--ac);color:var(--acd)}
.scb{display:flex;gap:6px;margin-top:8px}.scb:empty{display:none}
.chk.mine{border-color:var(--ac)}
.chk.other{background:#f6f6f7;color:#888}
.chk .by{font-size:12px;color:var(--acd)}
.ntabs{display:flex;gap:4px;margin:8px 0 4px}.ntabs button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font-size:13px}.ntabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
</style>
</head>
<body>
<div class="mockbar">
  <span>목업</span>
  <span class="roles"><button data-role="desk" class="on">데스크</button><button data-role="doc">원장 · 권태윤</button><button data-role="nurse">간호사 · 강도윤</button></span>
  <span class="lg"><i></i>주황 점선 = 이번 변경 (번호는 피드백 페이지와 같다)</span>
  <label><input type="checkbox" id="hlt" checked> 변경 표시</label>
</div>
<header class="app">
  <span class="logo">CÉRAMIQUE</span>
  <span class="nav" id="navname">현황판</span>
  <span class="r"><b>11:20</b><span>세라미크 명동점</span><span id="who">데스크</span><span>로그아웃</span></span>
</header>

<!-- ===== 데스크 ===== -->
<section class="view on" id="v-desk">
 <div class="desk">
  <div class="card board">
   <h1>실시간 현황판 <small>명동점 · 1층</small><span class="legend"><i class="lw"></i>대기 <i class="lc"></i>상담 <i class="la"></i>마취 · 준비 <i class="lp"></i>시술</span></h1>
   <div class="rooms" id="rooms"></div>
  </div>
  <div class="card side">
   <div class="search imp"><span class="imptag">D13</span>
     <input id="q" placeholder="고객 검색 — 영문 이름 · 한글 읽기 · 전화번호">
     <div class="sres" id="sres"></div>
   </div>
   <div class="tabs"><button class="on" data-tab="rsv">예약</button><button data-tab="stf">직원</button><button data-tab="now">현황</button></div>
   <div class="tabpane on" id="t-rsv">
     <div class="stats imp" id="stats"><span class="imptag">D7</span></div>
     <div class="meta" id="rcount" style="margin-bottom:4px"></div>
     <div class="rlist" id="rlist"></div>
   </div>
   <div class="tabpane" id="t-stf">
     <div class="ai imp" id="aibox"><span class="imptag">D12</span>
       <div class="h">배정 제안</div>
       <p>CHEN XIAO WEN 님이 류하린 상담사를 1시간 40분째 기다립니다. 민현우 상담사가 지금 비어 있습니다. 담당을 민현우로 바꿀까요?</p>
       <button class="btn pri sm" onclick="approveAI()">승인</button> <button class="btn sm" onclick="holdAI()">보류</button>
     </div>
     <div id="stafflist"></div>
   </div>
   <div class="tabpane" id="t-now"><div id="nowlist"></div></div>
  </div>
 </div>
</section>

<!-- ===== 원장 ===== -->
<section class="view" id="v-doc">
 <div class="staffv">
  <div class="card lst imp"><span class="imptag">W1</span>
   <h3>오늘 진료</h3>
   <div class="cnt">6명 · 지금 1 · 다음 1 · 이후 3 · 완료 1</div>
   <div id="doclist"></div>
  </div>
  <div class="card det" id="docdet"></div>
 </div>
</section>

<!-- ===== 간호사 ===== -->
<section class="view" id="v-nurse">
 <div class="staffv">
  <div class="card lst">
   <h3>내 할 일</h3>
   <div class="cnt">간호사 강도윤 · 지금 1 · 다음 1 · 이후 2 · 완료 2</div>
   <div id="nurselist"></div>
  </div>
  <div class="card det" id="nursedet"></div>
 </div>
</section>

<div class="dim" id="dim" onclick="closeAll()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
const NOW = 11*60+20;
const m = t => { const [h,mm]=t.split(':').map(Number); return h*60+mm; };
const dur = min => min>=60 ? `${Math.floor(min/60)}시간 ${min%60}분` : `${min}분`;

function renderRsv(){

    `<button class="stat ${s===filter?'on':''} ${s==='늦음'?'late':''}" onclick="setFilter('${s}')"><span>${s}</span><b>${cnt(s)}</b></button>`).join('');

  document.getElementById('rcount').textContent = `오늘 예약 ${total}건 · ${filter} ${cnt(filter)}건`;
  const ks = Object.keys(P).filter(k=>P[k].st===filter && !P[k].walk).sort((a,b)=>m(P[a].time)-m(P[b].time));
  document.getElementById('rlist').innerHTML = ks.map(k=>{
    const p=P[k]; const b = p.visit==='재진'?'<span class="badge">재진</span>':'<span class="badge first">첫 방문</span>';

     <button class="btn sm" onclick="openCall('간호사')">다른 간호사</button>
     <button class="btn sm" onclick="openCall('코디')">코디</button>
     <button class="btn sm" onclick="openCall('데스크')">데스크</button>
     <button class="btn sm warn" style="margin-left:auto" onclick="openCall('긴급')">긴급 · 이상 반응</button>
   </div>
   ${stripHtml('N2',
     {k:'지금 있는 곳',room:'관리실 06',rdy:'마취 끝까지 12분',who:'park',what:'포텐자 시술 준비',sel:true,click:''},
     {k:'다음 · 11:32',room:'관리실 06',rdy:'같은 방',who:'park',what:'마취크림 닦기 → 원장 시술 시작',click:'',btn:`<button class="btn pri sm" onclick="event.stopPropagation();openCall('원장','마취 끝 · 시술 시작 가능')">원장 호출</button>`})}
   <div class="meta" style="margin:8px 4px 0">마취 18분 경과 / 30분. 끝나기 5분 전(11:27)에 원장에게 자동으로 알린다. 그 뒤 · 관리실 04 LIU JIA HUI 시술 후 진정 관리.</div>
   <div class="sec imp" style="padding:6px"><span class="imptag">N4</span><h4>포텐자 준비 · ${doneAll} / ${PREP.length} 완료 · 내 몫 ${mine.length}건</h4>
     ${PREP.map(ck).join('')}
     <div class="meta" style="margin-top:4px">내 몫만 체크할 수 있다. 다른 사람 몫은 누가 언제 끝냈는지 보인다.</div>
     <div class="order"><div class="h">원장 오더 · 보기만 가능</div>
       <div>포텐자 펌핑팁 · 얼굴 전체 · 에너지 지난번(09-18)보다 한 단계 낮춤</div>
       <div class="meta">사유: 09-18 시술 후 홍조 2일. 설정값 변경은 원장이 한다.</div></div>
   </div>
   <div class="sec"><h4>지난 시술</h4><div class="hist">09-18 · 포텐자 펌핑팁 (원장 권태윤) · 시술 후 홍조 2일<br>08-21 · 포텐자 펌핑팁 (원장 권태윤) · 특이 반응 없음</div></div>`;

const CALL = {
 '원장':[['권태윤','관리실 04 · 시술 중 · 11:30 가능'],['임윤서','지금 비어 있음']],
 '간호사':[['류하람','지금 비어 있음'],['서가온','지금 비어 있음']],
 '코디':[['곽태린','지금 비어 있음'],['심준서','고객 안내 중']],
 '데스크':[['데스크','—']],
 '긴급':[['원장 전체 · 간호사 전체','즉시 알림']]
};
const REASON = {
 '원장':['마취 끝 · 시술 시작 가능','시술 전 확인 필요','고객 질문'],
 '간호사':['시술 보조 필요','손이 모자람','소모품 가져다 주기'],
 '코디':['고객 안내 · 이동','통역 필요','동행 안내'],
 '데스크':['수납 준비','다음 예약 잡기','보호자 · 동행 문의'],
 '긴급':['이상 반응 (호흡 · 어지러움 · 부종)','출혈 · 화상 의심']
};
function openCall(who,reason){
  const md=document.getElementById('modal');
  md.style.width='460px';
  md.innerHTML=`<button class="x" onclick="closeAll()">×</button>
   <div style="font-size:18px;font-weight:700;margin-bottom:4px">${who==='긴급'?'긴급 호출':who+' 호출'}</div>
   <div class="meta">관리실 06 · 박서연 · 강도윤 간호사가 부름</div>
   <div class="sec"><h4>누구를</h4><div class="opts" id="cw">${CALL[who].map((x,i)=>`<button class="opt ${i===0?'on':''}" onclick="pick(this,'cw')">${x[0]} <small>${x[1]}</small></button>`).join('')}</div></div>
   <div class="sec"><h4>왜</h4><div class="opts" id="cr">${REASON[who].map((x,i)=>`<button class="opt ${(reason?x===reason:i===0)?'on':''}" onclick="pick(this,'cr')">${x}</button>`).join('')}</div></div>
   <div class="foot"><button class="btn" onclick="closeAll()">취소</button><button class="btn ${who==='긴급'?'warn':'pri'}" onclick="doCall()">호출</button></div>`;
  show('modal');
}
function doCall(){
  const w=document.querySelector('#cw .opt.on').childNodes[0].textContent.trim(), r=document.querySelector('#cr .opt.on').textContent.trim();
  closeAll(); document.getElementById('modal').style.width=''; toast(`${w}에게 「관리실 06 · ${r}」 호출을 보냈습니다.`);
}

/* ---------- 공통 ---------- */
function renderAll(){ renderRooms(); renderRsv(); renderStaff(); renderDoc(); renderNurse(); }
function show(id){ document.getElementById('dim').classList.add('on'); document.getElementById(id).classList.add('on'); }
function closeAll(){ ['dim','drawer','modal'].forEach(i=>document.getElementById(i).classList.remove('on')); }
let tt; function toast(s){ const t=document.getElementById('toast'); t.textContent=s; t.style.display='block'; clearTimeout(tt); tt=setTimeout(()=>t.style.display='none',3200); }
document.querySelectorAll('.roles button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.roles button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.role));
  document.getElementById('who').textContent = {desk:'데스크',doc:'권태윤 원장',nurse:'강도윤 간호사'}[b.dataset.role];
  document.getElementById('navname').textContent = {desk:'현황판',doc:'오늘 진료',nurse:'내 할 일'}[b.dataset.role];
});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('on',p.id==='t-'+b.dataset.tab));
});
document.getElementById('hlt').onchange=e=>document.body.classList.toggle('nohl',!e.target.checked);
const q=document.getElementById('q'), sres=document.getElementById('sres');
q.oninput=()=>{ const v=q.value.trim().toLowerCase().replace(/[\s-]/g,''); if(!v){sres.style.display='none';return;}
  const hit=Object.keys(P).filter(k=>[P[k].en,P[k].ko,P[k].phone].join('|').toLowerCase().replace(/[\s-]/g,'').includes(v));
  sres.innerHTML = hit.map(k=>`<div onclick="sres.style.display='none';openCust('${k}')">${nm(k)}<br><small>${P[k].phone} · ${P[k].time} · ${P[k].st}${P[k].st==='원내'?' · '+P[k].loc:''}</small></div>`).join('') || '<div><small>찾는 고객이 없습니다. 이름 · 전화번호를 다시 확인해 주세요.</small></div>';
  sres.style.display='block'; };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll(); });
renderAll();
</script>
