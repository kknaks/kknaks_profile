[project]
name = "kknaks-back"
version = "0.1.0"
description = "kknaks.dev backend — FastAPI in-memory persona server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "open-kknaks>=0.1",            # LLM 호출 — ADR-04 (Anthropic SDK 미사용)
    "redis>=5.0",                  # open-kknaks broker
    "apscheduler>=3.10",
    "yt-dlp>=2024.12",             # YouTube 메타데이터 (content enrich 잡)
    "youtube-transcript-api>=0.6", # YouTube 자막 (content enrich 잡)
    "playwright>=1.49",            # PDF 생성 잡 (planning-02) — chromium headless 로 /print/* 라우트 → PDF
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
