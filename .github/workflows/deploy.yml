# 코드 push → SSH 홈서버 → git pull + docker compose up + admin/reload curl.
# planning-01 §3.6 ① 채널 (코드 변경 흐름).
#
# 콘텐츠 (`persona/**/*.md`) 만 변경된 push 는 deploy 안 돔 (paths-ignore).
# 콘텐츠는 webhook 채널 (② — back 컨테이너의 /admin/reload 가 직접 처리).
#
# 필요 secrets:
#   SSH_HOST        — 홈서버 외부 IP 또는 도메인
#   SSH_USER        — 홈서버 user (kknaks)
#   SSH_KEY         — Actions 가 사용할 private key (호스트에 public 등록)
#   SSH_PORT        — (선택) default 22
#   RELOAD_TOKEN    — admin/reload curl 인증 (ENV_FILE 의 RELOAD_TOKEN 과 동일)
#   ENV_FILE        — 호스트의 .env 통째로 (multiline secret).
#                     `.env.example` 형식으로 박되 실제 token/secret 값.
#                     Actions 가 SSH 후 매 deploy 시 호스트의 .env 를 이 값으로 덮어씀 — SoT.
#   GH_TOKEN        — (선택) private repo 면 clone/pull 인증 PAT.
#                     public repo 면 안 박아도 됨 — clone 무인증.

name: Deploy to homelab

on:
  push:
    branches: [main]
    paths-ignore:
      - "app/front/**"        # 프론트는 Vercel 자체 배포 — 홈서버 영향 X
      - "persona/**"          # 콘텐츠 변경은 webhook 채널 (planning-01 §3.6 ②)
      - "medi_docs/**"        # 문서 변경은 배포 영향 X
      - "claude_design/**"    # 디자인 자산 영향 X
      - "**.md"               # README 등 루트 md
  workflow_dispatch:           # 수동 트리거 (운영 디버깅)

concurrency:
  group: deploy-homelab
  cancel-in-progress: false   # 배포는 순차 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            REPO_DIR=/home/kknaks/kknaks_profile
            TOKEN="${{ secrets.GH_TOKEN }}"
            if [ -n "$TOKEN" ]; then
              REMOTE="https://kknaks:${TOKEN}@github.com/kknaks/kknaks_profile.git"
            else
              REMOTE="https://github.com/kknaks/kknaks_profile.git"
            fi

            echo "::group::ensure repo cloned (idempotent)"
            mkdir -p "$REPO_DIR"
            cd "$REPO_DIR"
            if [ ! -d .git ]; then
              # 디렉토리 안 비어있어도 동작 (init + fetch + checkout 패턴)
              git init -b main
              git remote add origin "$REMOTE" 2>/dev/null || git remote set-url origin "$REMOTE"
              git fetch origin main
              git checkout -B main origin/main
            else
              # 기존 repo — origin URL 만 갱신 (token 변경 시 자동 반영)
              git remote set-url origin "$REMOTE"
            fi
            echo "::endgroup::"

            echo "::group::git fetch + reset --hard"
            # rebase 가 아니라 reset --hard — 호스트 working tree 가 origin 의 mirror.
            # 잡 결과 commit 도중에 dirty 일 수 있는데, deploy 시점엔 origin 우선.
            git fetch origin main
            git reset --hard origin/main
            echo "::endgroup::"

            echo "::group::write .env"
            # ENV_FILE secret (GitHub) 을 호스트의 .env 로 덮어씀 — SoT
            cat > .env <<'__EOF__'
            ${{ secrets.ENV_FILE }}
            __EOF__
            chmod 600 .env
            echo ".env 갱신 (lines=$(wc -l < .env))"
            echo "::endgroup::"

            echo "::group::alembic upgrade head"
            # KDEV-WORK-015 — 마이그레이션 단계. 이게 없으면 배포는 초록불로 끝나는데
            # 관리자 로그인과 승인 큐가 통째로 안 된다 — `seed_admin` 이 DB 실패를
            # 삼키고 부팅을 계속하기 때문에 **조용히** 반쯤 죽는다.
            #
            # back 을 띄우기 **전에** 돌린다. 스키마가 없는 상태로 lifespan 이 돌면
            # 시드가 실패한 채로 서비스가 올라간다.
            docker compose build back
            docker compose up -d --wait postgres redis
            docker compose run --rm --entrypoint "" back \
              uv run --no-sync alembic upgrade head
            echo "::endgroup::"

            echo "::group::docker compose up"
            # KDEV-WORK-012 — slack-bridge 컨테이너는 back 에 흡수됐다.
            # Slack 캡처는 .env 의 SLACK_CAPTURE_ENABLED 로 back lifespan 안에서 켜고 끈다.
            docker compose up -d --build back redis worker
            # 흡수 이전 배포에서 남아 있을 수 있는 컨테이너 정리 (최초 1회 이후엔 no-op)
            docker rm -f kknaks-slack-bridge 2>/dev/null || true
            echo "::endgroup::"

            echo "::group::wait for back healthy (ping)"
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null -X POST http://localhost:48000/admin/reload \
                   -H "X-Reload-Token: ${{ secrets.RELOAD_TOKEN }}" \
                   -H "X-GitHub-Event: ping"; then
                echo "back ready (attempt $i)"
                break
              fi
              sleep 2
              if [ "$i" = "30" ]; then
                echo "back never came up — check 'docker compose logs back'"
                exit 1
              fi
            done
            echo "::endgroup::"

            echo "::group::trigger /admin/reload"
            curl -fsS -X POST http://localhost:48000/admin/reload \
              -H "X-Reload-Token: ${{ secrets.RELOAD_TOKEN }}" \
              -w "\nHTTP %{http_code}\n"
            echo "::endgroup::"
