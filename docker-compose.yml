# spec-05 §7 — back + redis + worker (ADR-04 §2.2).
# 포트 컨벤션 — 4-prefix (사용자 컨벤션).

services:
  back:
    build:
      context: .
      dockerfile: Dockerfile.back
    container_name: kknaks-back
    user: "1000:1000"                          # host kknaks uid 와 매핑 — mount file 권한 충돌 회피
    ports:
      - "48000:48000"
    environment:
      REDIS_URL: redis://redis:6379          # 컨테이너 내부 통신은 redis 기본 포트
      # 애플리케이션 DB (KDEV-WORK-011) — 크리덴셜은 .env 의 POSTGRES_* 에서 치환(커밋 파일에 비번 리터럴 금지).
      # host = postgres (컨테이너 네트워크 호스트명, 비밀 아님). .env 의 DATABASE_URL(localhost:45433)은 호스트 alembic/pytest 용.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kknaks}:${POSTGRES_PASSWORD:-kknaks}@postgres:5432/${POSTGRES_DB:-kknaks}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-1}   # 운영은 HTTPS 전용
      PERSONA_DIR: /repo/persona
      RUN_SCHEDULER: "1"
      JOB_GIT_PUSH_DRY_RUN: ${JOB_GIT_PUSH_DRY_RUN:-1}   # 운영 시 .env 에 0 박기
      RELOAD_TOKEN: ${RELOAD_TOKEN:-changeme}
      GH_USER_PERSONAL: ${GH_USER_PERSONAL:-kknaks}
      GH_TOKEN_PERSONAL: ${GH_TOKEN_PERSONAL:-}
      GH_EMAIL_PERSONAL: ${GH_EMAIL_PERSONAL:-}
      GH_USER_COMPANY: ${GH_USER_COMPANY:-}
      GH_TOKEN_COMPANY: ${GH_TOKEN_COMPANY:-}
      GH_EMAIL_COMPANY: ${GH_EMAIL_COMPANY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # Slack 지식 캡처 (KDEV-WORK-012 — 별도 slack-bridge 컨테이너에서 흡수)
      NAMESPACE: ${NAMESPACE:-kknaks-portfolio}
      SLACK_CAPTURE_ENABLED: ${SLACK_CAPTURE_ENABLED:-0}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      ALLOWED_SLACK_USERS: ${ALLOWED_SLACK_USERS:-}
      ALLOWED_SLACK_CHANNELS: ${ALLOWED_SLACK_CHANNELS:-}
      CAPTURE_PROVIDER: ${CAPTURE_PROVIDER:-claude}
      CAPTURE_MODEL: ${CAPTURE_MODEL:-}
      CAPTURE_WORK_DIR: ${CAPTURE_WORK_DIR:-/repo}
      CAPTURE_TIMEOUT_SECONDS: ${CAPTURE_TIMEOUT_SECONDS:-600}
      REPO_ROOT: /repo
      # planning-02 — PDF 잡이 hit 할 frontend URL. 운영 = Vercel 정적 호스팅.
      FRONTEND_URL: ${FRONTEND_URL:-https://kknaks.dev}
    volumes:
      - .:/repo                                # repo root 전체 (.git + persona + app) — planning-01 §3.6 mount
    working_dir: /repo/app/back
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: kknaks-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kknaks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kknaks}
      POSTGRES_DB: ${POSTGRES_DB:-kknaks}
    ports:
      - "45433:5432"                          # 호스트 포트 4-prefix, 컨테이너 내부 기본 5432
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kknaks} -d ${POSTGRES_DB:-kknaks}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kknaks-redis
    ports:
      - "46379:6379"                          # 호스트 포트 4-prefix, 컨테이너 내부는 기본 6379
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: kknaks-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      NAMESPACE: kknaks-portfolio              # content_enrich.py LLM_NAMESPACE 와 일치
      QUEUES: default
      CONCURRENCY: "2"
      WORK_DIR: /tmp
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # 호스트 path 그대로 컨테이너 안에서도 매핑 — npm symlink/require 깨짐 회피
      PATH: /home/kknaks/.local/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      # capture worker가 repo-local skill을 읽되 파일은 쓰지 못하게 한다.
      - .:/repo:ro
      # 호스트의 system claude (npm install -g 결과) 를 그대로 mount
      - /home/kknaks/.local:/home/kknaks/.local:ro
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
