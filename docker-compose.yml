# spec-05 §7 — back + redis + worker (ADR-04 §2.2).
# 포트 컨벤션 — 4-prefix (사용자 컨벤션).

services:
  back:
    build:
      context: .
      dockerfile: Dockerfile.back
    container_name: kknaks-back
    ports:
      - "48000:48000"
    environment:
      REDIS_URL: redis://redis:6379          # 컨테이너 내부 통신은 redis 기본 포트
      PERSONA_DIR: /repo/persona
      RUN_SCHEDULER: "1"
      JOB_GIT_PUSH_DRY_RUN: ${JOB_GIT_PUSH_DRY_RUN:-1}   # 운영 시 .env 에 0 박기
      RELOAD_TOKEN: ${RELOAD_TOKEN:-changeme}
      GH_TOKEN: ${GH_TOKEN:-}                   # 개인 계정 PAT (legacy fallback)
      GH_USER_PERSONAL: ${GH_USER_PERSONAL:-kknaks}
      GH_TOKEN_PERSONAL: ${GH_TOKEN_PERSONAL:-}
      GH_EMAIL_PERSONAL: ${GH_EMAIL_PERSONAL:-}
      GH_USER_COMPANY: ${GH_USER_COMPANY:-}
      GH_TOKEN_COMPANY: ${GH_TOKEN_COMPANY:-}
      GH_EMAIL_COMPANY: ${GH_EMAIL_COMPANY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - .:/repo                                # repo root 전체 (.git + persona + back + frontend) — planning-01 §3.6 mount
    working_dir: /repo/back
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kknaks-redis
    ports:
      - "46379:6379"                          # 호스트 포트 4-prefix, 컨테이너 내부는 기본 6379
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: kknaks-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      NAMESPACE: kknaks-portfolio              # content_enrich.py LLM_NAMESPACE 와 일치
      QUEUES: default
      CONCURRENCY: "2"
      WORK_DIR: /tmp
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      PATH: /claude-tools/node/bin:/claude-tools/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - ./.claude-tools:/claude-tools:ro       # Linux Node.js + claude CLI 바이너리 (호스트에서 setup)
    restart: unless-stopped

volumes:
  redis-data:
