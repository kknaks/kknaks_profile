# Mac 로컬 dev 전용 compose. 운영 (홈서버) 은 docker-compose.yml.
# 사용법: docker compose -f docker-compose.local.yml up -d --build
#
# server 와 차이:
# - user: 501:20 (macOS kknaks uid:gid) ↔ server 1000:1000
# - worker mount: /Users/kknaks/.local ↔ server /home/kknaks/.local
# - JOB_GIT_PUSH_DRY_RUN: 1 강제 (로컬에서 main 에 push 사고 방지)

services:
  back:
    build:
      context: .
      dockerfile: Dockerfile.back
    container_name: kknaks-back
    user: "501:20"
    ports:
      - "48000:48000"
    environment:
      REDIS_URL: redis://redis:6379
      # 애플리케이션 DB (KDEV-WORK-011) — 크리덴셜은 .env 의 POSTGRES_* 에서 치환(커밋 파일에 비번 리터럴 금지).
      # host = postgres (컨테이너 네트워크 호스트명, 비밀 아님). .env 의 DATABASE_URL(localhost:45433)은 호스트 alembic/pytest 용.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kknaks}:${POSTGRES_PASSWORD:-kknaks}@postgres:5432/${POSTGRES_DB:-kknaks}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}   # 로컬 http dev
      PERSONA_DIR: /repo/persona
      RUN_SCHEDULER: "1"
      JOB_GIT_PUSH_DRY_RUN: "1"
      RELOAD_TOKEN: ${RELOAD_TOKEN:-changeme}
      GH_USER_PERSONAL: ${GH_USER_PERSONAL:-kknaks}
      GH_TOKEN_PERSONAL: ${GH_TOKEN_PERSONAL:-}
      GH_EMAIL_PERSONAL: ${GH_EMAIL_PERSONAL:-}
      GH_USER_COMPANY: ${GH_USER_COMPANY:-}
      GH_TOKEN_COMPANY: ${GH_TOKEN_COMPANY:-}
      GH_EMAIL_COMPANY: ${GH_EMAIL_COMPANY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # Slack 지식 캡처 (KDEV-WORK-012 — 별도 slack-bridge 컨테이너에서 흡수)
      NAMESPACE: ${NAMESPACE:-kknaks-portfolio}
      SLACK_CAPTURE_ENABLED: ${SLACK_CAPTURE_ENABLED:-0}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      ALLOWED_SLACK_USERS: ${ALLOWED_SLACK_USERS:-}
      ALLOWED_SLACK_CHANNELS: ${ALLOWED_SLACK_CHANNELS:-}
      CAPTURE_PROVIDER: ${CAPTURE_PROVIDER:-claude}
      CAPTURE_MODEL: ${CAPTURE_MODEL:-}
      CAPTURE_WORK_DIR: ${CAPTURE_WORK_DIR:-/repo}
      CAPTURE_TIMEOUT_SECONDS: ${CAPTURE_TIMEOUT_SECONDS:-600}
      REPO_ROOT: /repo
      # planning-02 — PDF 잡이 hit 할 frontend URL.
      # Mac docker → host.docker.internal:3000 (host 의 next dev). Linux 라면 host-gateway alias 필요.
      FRONTEND_URL: ${FRONTEND_URL:-http://host.docker.internal:3000}
      # 잔디 커밋 조사 — 운영과 같은 경로. `/repo` 밖이어야 한다(KDEV-SPEC-011 §5).
      REPO_CACHE_DIR: /var/cache/repos
      COMMIT_IDENTITY_PATTERNS: ${COMMIT_IDENTITY_PATTERNS:-}
    volumes:
      - .:/repo
      - repo-cache:/var/cache/repos
    working_dir: /repo/app/back
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: kknaks-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kknaks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kknaks}
      POSTGRES_DB: ${POSTGRES_DB:-kknaks}
    ports:
      - "45433:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kknaks} -d ${POSTGRES_DB:-kknaks}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kknaks-redis
    ports:
      - "46379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: kknaks-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      NAMESPACE: kknaks-portfolio
      QUEUES: default
      CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORK_DIR: /tmp
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # ADR-04 원형 패턴 — repo 안 .claude-tools/ (Linux ARM64 node + claude CLI 박제) 를 마운트
      PATH: /claude-tools/node/bin:/claude-tools/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - .:/repo:ro
      - ./.claude-tools:/claude-tools:ro
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  repo-cache:
