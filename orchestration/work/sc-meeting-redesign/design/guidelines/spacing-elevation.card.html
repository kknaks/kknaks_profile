<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Four shadows, all near-black at 6–10%. Cards get a 1px ring plus a 1px shadow; panels get a soft 16px blur." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div style="display:flex;gap:20px;padding:8px 4px 16px"><div style="text-align:center"><div style="width:120px;height:64px;border-radius:14px;background:var(--ax-surface);box-shadow:var(--ax-ring),var(--ax-shadow-card)"></div><span class="n">card</span></div><div style="text-align:center"><div style="width:120px;height:64px;border-radius:14px;background:var(--ax-surface);box-shadow:var(--ax-ring),var(--ax-shadow-raised)"></div><span class="n">raised</span></div><div style="text-align:center"><div style="width:120px;height:64px;border-radius:14px;background:var(--ax-surface);box-shadow:var(--ax-ring),var(--ax-shadow-panel)"></div><span class="n">panel</span></div><div style="text-align:center"><div style="width:120px;height:64px;border-radius:14px;background:var(--ax-surface);box-shadow:var(--ax-ring),var(--ax-shadow-rail)"></div><span class="n">rail</span></div></div></body></html>
