<!-- @dsCard group="Colors" viewport="700x130" name="Brand greys" subtitle="A second, warmer neutral scale the kit inherits for buttons and chrome in its older components." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:var(--brand-100)"></div><span class="n">brand-100</span><span class="v">var(--brand-100)</span></div><div class="chip"><div class="box" style="background:var(--brand-200)"></div><span class="n">brand-200</span><span class="v">var(--brand-200)</span></div><div class="chip"><div class="box" style="background:var(--brand-400)"></div><span class="n">brand-400</span><span class="v">var(--brand-400)</span></div><div class="chip"><div class="box" style="background:var(--brand-500)"></div><span class="n">brand-500</span><span class="v">var(--brand-500)</span></div><div class="chip"><div class="box" style="background:var(--brand-600)"></div><span class="n">brand-600</span><span class="v">var(--brand-600)</span></div><div class="chip"><div class="box" style="background:var(--brand-800)"></div><span class="n">brand-800</span><span class="v">var(--brand-800)</span></div><div class="chip"><div class="box" style="background:var(--brand-900)"></div><span class="n">brand-900</span><span class="v">var(--brand-900)</span></div></div></body></html>
