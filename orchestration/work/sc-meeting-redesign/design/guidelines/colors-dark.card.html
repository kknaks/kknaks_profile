<!-- @dsCard group="Colors" viewport="700x140" name="Dark mode" subtitle="The token set ships a full dark theme — set data-theme=&quot;dark&quot; on :root. The AX screens themselves are light-only." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div data-theme="dark" class="dark" style="background:var(--background-normal-normal);padding:14px;border-radius:12px"><div class="sw"><div class="chip"><div class="box" style="background:var(--background-normal-normal)"></div><span class="n">bg normal</span><span class="v">var(--background-normal-normal)</span></div><div class="chip"><div class="box" style="background:var(--background-elevated-normal)"></div><span class="n">bg elevated</span><span class="v">var(--background-elevated-normal)</span></div><div class="chip"><div class="box" style="background:var(--label-normal)"></div><span class="n">label-normal</span><span class="v">var(--label-normal)</span></div><div class="chip"><div class="box" style="background:var(--label-alternative)"></div><span class="n">label-alt</span><span class="v">var(--label-alternative)</span></div><div class="chip"><div class="box" style="background:var(--primary-normal)"></div><span class="n">primary</span><span class="v">var(--primary-normal)</span></div><div class="chip"><div class="box" style="background:var(--line-normal-normal)"></div><span class="n">line</span><span class="v">var(--line-normal-normal)</span></div></div></div></body></html>
