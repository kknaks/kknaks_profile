<!-- @dsCard group="Colors" viewport="700x130" name="Surfaces" subtitle="Only two light surfaces: white for content, cool-neutral-99 for the nav rail and alt panels." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:var(--ax-surface)"></div><span class="n">surface</span><span class="v">#fff</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-alt)"></div><span class="n">surface-alt</span><span class="v">rgb(247,247,248)</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-nav)"></div><span class="n">nav rail</span><span class="v">rgb(247,247,248)</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-nav-active)"></div><span class="n">nav active</span><span class="v">#000</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-nav-hover)"></div><span class="n">nav hover</span><span class="v">rgb(235,242,253)</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-inverse)"></div><span class="n">inverse</span><span class="v">rgb(27,28,30)</span></div></div></body></html>
