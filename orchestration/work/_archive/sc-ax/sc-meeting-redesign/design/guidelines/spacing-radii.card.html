<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:var(--ax-surface-alt);border-radius:var(--ax-r-xs);box-shadow:var(--ax-ring)"></div><span class="n">6px</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-alt);border-radius:var(--ax-r-sm);box-shadow:var(--ax-ring)"></div><span class="n">8px</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-alt);border-radius:var(--ax-r-md);box-shadow:var(--ax-ring)"></div><span class="n">10px</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-alt);border-radius:var(--ax-r-lg);box-shadow:var(--ax-ring)"></div><span class="n">12px</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-alt);border-radius:var(--ax-r-xl);box-shadow:var(--ax-ring)"></div><span class="n">14px</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-alt);border-radius:var(--ax-r-2xl);box-shadow:var(--ax-ring)"></div><span class="n">15px</span></div><div class="chip"><div class="box" style="background:var(--ax-surface-alt);border-radius:var(--ax-r-pill);box-shadow:var(--ax-ring)"></div><span class="n">999px</span></div></div></body></html>
