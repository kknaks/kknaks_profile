<!-- @dsCard group="Colors" viewport="700x130" name="Cool neutral ramp" subtitle="The solid neutral scale behind surfaces, dividers and dark-mode ink." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:var(--cool-neutral-10)"></div><span class="n">cool-neutral-10</span><span class="v">var(--cool-neutral-10)</span></div><div class="chip"><div class="box" style="background:var(--cool-neutral-15)"></div><span class="n">cool-neutral-15</span><span class="v">var(--cool-neutral-15)</span></div><div class="chip"><div class="box" style="background:var(--cool-neutral-22)"></div><span class="n">cool-neutral-22</span><span class="v">var(--cool-neutral-22)</span></div><div class="chip"><div class="box" style="background:var(--cool-neutral-50)"></div><span class="n">cool-neutral-50</span><span class="v">var(--cool-neutral-50)</span></div><div class="chip"><div class="box" style="background:var(--cool-neutral-70)"></div><span class="n">cool-neutral-70</span><span class="v">var(--cool-neutral-70)</span></div><div class="chip"><div class="box" style="background:var(--cool-neutral-96)"></div><span class="n">cool-neutral-96</span><span class="v">var(--cool-neutral-96)</span></div><div class="chip"><div class="box" style="background:var(--cool-neutral-99)"></div><span class="n">cool-neutral-99</span><span class="v">var(--cool-neutral-99)</span></div></div></body></html>
