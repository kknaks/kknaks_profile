<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing scale" subtitle="4px base. Panel gutters are 12 / 20 / 24; the inbox rail uses 20px 24px and 10px between cards." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div style="display:flex;align-items:flex-end;gap:12px"><div style="text-align:center"><div style="width:2px;height:38px;background:var(--ax-accent);border-radius:2px"></div><span class="n">0px</span><span class="v">--spacing-0</span></div><div style="text-align:center"><div style="width:4px;height:38px;background:var(--ax-accent);border-radius:2px"></div><span class="n">4px</span><span class="v">--spacing-1</span></div><div style="text-align:center"><div style="width:8px;height:38px;background:var(--ax-accent);border-radius:2px"></div><span class="n">8px</span><span class="v">--spacing-2</span></div><div style="text-align:center"><div style="width:12px;height:38px;background:var(--ax-accent);border-radius:2px"></div><span class="n">12px</span><span class="v">--spacing-3</span></div><div style="text-align:center"><div style="width:16px;height:38px;background:var(--ax-accent);border-radius:2px"></div><span class="n">16px</span><span class="v">--spacing-4</span></div><div style="text-align:center"><div style="width:20px;height:38px;background:var(--ax-accent);border-radius:2px"></div><span class="n">20px</span><span class="v">--spacing-5</span></div><div style="text-align:center"><div style="width:24px;height:38px;background:var(--ax-accent);border-radius:2px"></div><span class="n">24px</span><span class="v">--spacing-6</span></div></div></body></html>
