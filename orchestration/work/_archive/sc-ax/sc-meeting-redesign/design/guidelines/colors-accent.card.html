<!-- @dsCard group="Colors" viewport="700x130" name="Accent — violet" subtitle="The AX accent. violet-50 is the single brand colour in the file; everything else is a tint of it." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:var(--violet-45)"></div><span class="n">violet-45</span><span class="v">rgb(55,77,246)</span></div><div class="chip"><div class="box" style="background:var(--violet-50)"></div><span class="n">violet-50</span><span class="v">rgb(84,103,247)</span></div><div class="chip"><div class="box" style="background:var(--violet-60)"></div><span class="n">violet-60</span><span class="v">rgb(113,129,248)</span></div><div class="chip"><div class="box" style="background:var(--violet-70)"></div><span class="n">violet-70</span><span class="v">rgb(158,134,252)</span></div><div class="chip"><div class="box" style="background:var(--violet-90)"></div><span class="n">violet-90</span><span class="v">rgb(219,211,254)</span></div><div class="chip"><div class="box" style="background:var(--violet-95)"></div><span class="n">violet-95</span><span class="v">rgb(240,236,254)</span></div><div class="chip"><div class="box" style="background:var(--ax-accent-08)"></div><span class="n">accent 8%</span><span class="v">rgba(84,103,247,.08)</span></div></div></body></html>
