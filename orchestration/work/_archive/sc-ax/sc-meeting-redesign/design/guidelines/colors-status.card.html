<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Badge and alert hues. Used sparingly — a red count bubble, a cyan 'in progress' badge." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:var(--red-40)"></div><span class="n">red-40 danger</span><span class="v">rgb(229,34,34)</span></div><div class="chip"><div class="box" style="background:var(--green-50)"></div><span class="n">green-50</span><span class="v">rgb(0,191,64)</span></div><div class="chip"><div class="box" style="background:var(--cyan-40)"></div><span class="n">cyan-40</span><span class="v">rgb(0,152,178)</span></div><div class="chip"><div class="box" style="background:var(--yellow-500)"></div><span class="n">yellow-500</span><span class="v">rgb(229,160,0)</span></div><div class="chip"><div class="box" style="background:var(--orange-50)"></div><span class="n">orange-50</span><span class="v">rgb(255,146,0)</span></div><div class="chip"><div class="box" style="background:var(--purple-40)"></div><span class="n">purple-40</span><span class="v">rgb(173,54,227)</span></div></div></body></html>
