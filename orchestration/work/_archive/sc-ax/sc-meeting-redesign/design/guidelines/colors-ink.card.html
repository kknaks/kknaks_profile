<!-- @dsCard group="Colors" viewport="700x130" name="Ink — label ladder" subtitle="Text colours are alpha steps on rgb(55,56,60) / rgb(46,47,51), not separate greys." -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:var(--label-strong)"></div><span class="n">label-strong</span><span class="v">#000</span></div><div class="chip"><div class="box" style="background:var(--label-normal)"></div><span class="n">label-normal</span><span class="v">rgb(23,23,25)</span></div><div class="chip"><div class="box" style="background:var(--label-neutral)"></div><span class="n">label-neutral</span><span class="v">46,47,51 · 88%</span></div><div class="chip"><div class="box" style="background:var(--label-alternative)"></div><span class="n">label-alternative</span><span class="v">55,56,60 · 61%</span></div><div class="chip"><div class="box" style="background:var(--label-assistive)"></div><span class="n">label-assistive</span><span class="v">55,56,60 · 28%</span></div><div class="chip"><div class="box" style="background:var(--label-disable)"></div><span class="n">label-disable</span><span class="v">55,56,60 · 16%</span></div></div></body></html>
