<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ax-surface);font-family:var(--font-ui);color:var(--ax-ink)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{width:92px}.box{height:52px;border-radius:8px;box-shadow:var(--ax-ring-weak)}.n{display:block;font:500 10px/1.4 var(--font-ui);letter-spacing:.02em;color:var(--ax-ink-alt);margin-top:5px;word-break:break-all}.v{display:block;font:400 9px/1.4 var(--font-ui);color:var(--ax-ink-assistive)}</style></head><body><div class="sw"><div class="chip"><div class="box" style="background:var(--ax-line-weak);box-shadow:inset 0 0 0 1px var(--ax-line-weak)"></div><span class="n">line-weak</span><span class="v">112,115,124 · 8%</span></div><div class="chip"><div class="box" style="background:var(--ax-line);box-shadow:inset 0 0 0 1px var(--ax-line)"></div><span class="n">line</span><span class="v">112,115,124 · 16%</span></div><div class="chip"><div class="box" style="background:var(--ax-line-strong);box-shadow:inset 0 0 0 1px var(--ax-line-strong)"></div><span class="n">line-strong</span><span class="v">112,115,124 · 22%</span></div><div class="chip"><div class="box" style="background:var(--ax-fill-weak);box-shadow:inset 0 0 0 1px var(--ax-fill-weak)"></div><span class="n">fill-weak</span><span class="v">112,115,124 · 5%</span></div><div class="chip"><div class="box" style="background:var(--ax-fill);box-shadow:inset 0 0 0 1px var(--ax-fill)"></div><span class="n">fill</span><span class="v">112,115,124 · 8%</span></div><div class="chip"><div class="box" style="background:var(--ax-fill-strong);box-shadow:inset 0 0 0 1px var(--ax-fill-strong)"></div><span class="n">fill-strong</span><span class="v">112,115,124 · 16%</span></div></div></body></html>
