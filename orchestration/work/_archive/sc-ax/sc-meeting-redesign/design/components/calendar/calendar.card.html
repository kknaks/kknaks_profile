</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Calendar, CalendarButton, CalendarButton2, CalendarMonthField, CalendarYearField } = window.TheSCAXDesignSystem_7e8395;
const Row = ({ label, children, style }) => <div className="row" style={style}><span className="lbl">{label}</span>{children}</div>;
const mount = (el) => ReactDOM.createRoot(document.getElementById('root')).render(el);

mount(<>
  <Row label="Day">{['default','hover','active','disabled','range','hidden'].map(s=><CalendarButton key={s} state={s} number="12" />)}</Row>
  <Row label="Work day"><CalendarButton2 state="default" date="7" /><CalendarButton2 state="today" date="7" /><CalendarButton2 selected date="7" /><CalendarButton2 state="disabled" date="7" /><CalendarButton2 dot date="7" /></Row>
  <Row label="Fields"><CalendarMonthField value="9월" hasLabel label="월" /><CalendarYearField value="2026" /></Row>
  <Row label="Month" style={{alignItems:'flex-start'}}><Calendar /></Row>
</>);
</script></body></html>
