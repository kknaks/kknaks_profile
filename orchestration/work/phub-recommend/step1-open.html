<script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(v==null)continue;if(n==='text')e.textContent=v;else e.setAttribute(n,v)}for(const c of k)if(c!=null)e.append(c);return e};
const A={};let db=null,canWrite=false,onlyLeft=false;
const apIt=D.approve.flatMap(s=>s.items),askIt=D.ask.flatMap(s=>s.items);
// 승인 = 고르면 끝(「다르게」는 메모 필수) · 질문 · 직접 확인 = 메모가 있으면 끝
const done=(id,kind)=>{const a=A[id];if(!a)return false;const n=(a.note||'').trim();return kind==='ap'?(a.choice==='rec'||(a.choice==='other'&&!!n)):!!n};
function sit(){const left=(xs,k)=>xs.filter(i=>!done(i.id,k)).length;
 const la=left(apIt,'ap'),lq=left(askIt,'q'),lm=left(D.mine,'m');
 $('#sit').replaceChildren('30묶음 중 ',el('b',{text:String(D.groups_decided)}),'묶음 정해짐 · 남은 항목 ',el('b',{text:String(la+lq+lm)}),
  ' — 승인 ',el('b',{text:String(la)}),' · 병원에 물을 것 ',el('b',{text:String(lq)}),' · 직접 볼 것 ',el('b',{text:String(lm)}),' · 진행 중 ',el('b',{text:String(D.running.length)}))}
async function save(id,patch,sv,row,kind){const prev=A[id]||{choice:null,note:''};A[id]={...prev,...patch};row.dataset.done=done(id,kind)?'1':'';sit();
 if(!db||!canWrite){sv.textContent='저장 안 됨 — 저장소에 연결되지 않았습니다';sv.className='sv err';return}
 sv.textContent='저장 중…';sv.className='sv';
 try{await db.doc('answers/'+id).set({choice:A[id].choice??null,note:A[id].note||'',updated_at:new Date().toISOString()});
  sv.textContent=(kind==='ap'&&A[id].choice==='other'&&!(A[id].note||'').trim())?'저장됨 · 메모를 적어 주세요':'저장됨'}
 catch(e){sv.textContent='저장 실패 — 다시 입력해 주세요';sv.className='sv err'}}
const head=(n,c,why)=>el('div',{class:'l1'},el('span',{class:'nm',text:n}),why?el('span',{class:'why',text:' — '+why}):null,el('span',{class:'cd',text:c}));
function apRow(i){const a=A[i.id]||{};const row=el('div',{class:'it','data-done':done(i.id,'ap')?'1':''});const sv=el('span',{class:'sv',text:a.updated_at?'저장됨':''});
 row.append(head(i.n,i.c,i.why),el('div',{class:'rec'},el('b',{text:'추천 '}),i.rec));
 const note=el('input',{type:'text',placeholder:'다르게 — 어떻게 할지 메모','aria-label':i.n+' 메모'});note.value=a.note||'';
 const ans=el('div',{class:'ans',role:'radiogroup','aria-label':i.n});
 for(const[v,t]of[['rec','추천대로'],['other','다르게']]){const r=el('input',{type:'radio',name:'r-'+i.id,value:v});r.checked=a.choice===v;
  r.onchange=()=>{save(i.id,{choice:v},sv,row,'ap');if(v==='other')note.focus()};ans.append(el('label',{class:'opt'},r,el('span',{text:t})))}
 note.onchange=()=>save(i.id,{note:note.value},sv,row,'ap');ans.append(note,sv);row.append(ans);
 if(i.b)row.append(el('details',{},el('summary',{text:'근거'}),el('p',{text:i.b})));
 return row}
function memoRow(i,kind,text,ph){const a=A[i.id]||{};const row=el('div',{class:'it','data-done':done(i.id,kind)?'1':''});const sv=el('span',{class:'sv',text:a.updated_at?'저장됨':''});
 row.append(head(i.n,i.c,null),el('div',{class:'rec',text:text}));
 const note=el('input',{type:'text',placeholder:ph,'aria-label':i.n+' '+ph});note.value=a.note||'';
 note.onchange=()=>save(i.id,{choice:note.value.trim()?'answered':null,note:note.value},sv,row,kind);
 row.append(el('div',{class:'ans'},note,sv));return row}
const sec=(title,n,desc,...k)=>el('section',{class:'sec'},el('h2',{},title,el('span',{class:'n',text:n})),desc?el('p',{text:desc}):null,...k);
function render(){const m=$('#main');m.replaceChildren();
 // 1. 승인
 const c1=el('div',{class:'card'});let n1=0;
 for(const s of D.approve){const xs=s.items.filter(i=>!onlyLeft||!done(i.id,'ap'));if(!xs.length)continue;
  c1.append(el('div',{class:'sub'},s.t,el('span',{class:'g',text:s.g})));for(const i of xs){c1.append(apRow(i));n1++}}
 if(!n1)c1.append(el('div',{class:'it',text:'남은 항목이 없습니다.'}));
 m.append(sec('1. 승인만 하면 되는 것',`${apIt.length}개`,'추천이 붙어 있다. 맞으면 「추천대로」, 아니면 「다르게」를 고르고 메모.',c1));
 // 2. 병원에 물을 것
 const c2=el('div',{class:'card'});let n2=0;
 for(const s of D.ask){const xs=s.items.filter(i=>!onlyLeft||!done(i.id,'q'));if(!xs.length)continue;
  c2.append(el('div',{class:'sub',text:s.t}));for(const i of xs){c2.append(memoRow(i,'q',i.q,'받은 답'));n2++}}
 if(!n2)c2.append(el('div',{class:'it',text:'남은 질문이 없습니다.'}));
 const cp=el('button',{class:'btn',type:'button',text:'질문 전체 복사'});const cps=el('span',{class:'sv'});
 cp.onclick=async()=>{let k=0;const txt=D.ask.map(s=>`[${s.t}]\n`+s.items.map(i=>`${++k}. ${i.q}`).join('\n')).join('\n\n');
  try{await navigator.clipboard.writeText(txt);cps.textContent=`${k}개 복사됨`;cps.className='sv'}catch(e){cps.textContent='복사 실패 — 브라우저가 막았습니다';cps.className='sv err'}};
 m.append(sec('2. 원천(병원)에 물어볼 것',`${askIt.length}개`,null,el('div',{class:'hdr'},el('p',{style:'margin:0;font-size:12.5px;color:var(--muted)',text:'출처로 닫지 못해 병원 답이 있어야 정해진다. 답을 받으면 칸에 적는다.'}),el('span',{},cp,' ',cps)),c2));
 // 3. 직접 볼 것
 const c3=el('div',{class:'card'});const xs3=D.mine.filter(i=>!onlyLeft||!done(i.id,'m'));
 for(const i of xs3)c3.append(memoRow(i,'m',i.what,'확인한 것 메모'));
 if(!xs3.length)c3.append(el('div',{class:'it',text:'남은 항목이 없습니다.'}));
 m.append(sec('3. 확인 중 · 직접 볼 것',`${D.mine.length}개`,'현장 명판 · 허가 첨부 등 직접 봐야 닫힌다.',c3));
 // 4. 진행 중
 m.append(sec('4. 진행 중 (워커)',`${D.running.length}개`,null,el('div',{class:'card'},...D.running.map(r=>el('div',{class:'ro'},el('span',{class:'mk',text:'…'}),el('span',{},el('b',{text:r.n}),' — '+r.why))))));
 // 5. 그 뒤
 m.append(sec('5. 답을 다 받은 뒤 할 일',`${D.after.length}단계`,null,el('div',{class:'card'},...D.after.map((t,k)=>el('div',{class:'ro'},el('span',{class:'mk',text:String(k+1).padStart(2,'0')}),el('span',{text:t}))))));
 sit()}
$('#onlyLeft').onclick=()=>{onlyLeft=!onlyLeft;$('#onlyLeft').setAttribute('aria-pressed',String(onlyLeft));render()};
render();
(async()=>{try{db=await window.claude?.use?.('db');if(!db){$('#status').textContent='답변 저장소를 쓸 수 없습니다. 로그인한 상태로 열어 주세요.';return}
 const u=await window.claude.use('user');const cw=u?.can?await u.can('data.write'):null;canWrite=cw!==false;
 const s=await db.collection('answers').get();for(const d of s.docs)A[d.id]=d.data()||{};
 $('#status').textContent=`답 ${Object.keys(A).length}개 불러옴 · 입력하면 바로 저장됩니다`;render()}
 catch(e){$('#status').textContent='답을 불러오지 못했습니다. 새로고침해 주세요.'}})();
})();
</script>
