<title>실버 질문 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">

<style>
/* Layout: 맨 위 한 줄 + 받는 사람별 탭 2. 항목 = 한 줄(질문 → 추천) · 작은 표시(id · 나온 곳 · 상태) → 답 칸, 근거는 접힘 */
:root{--bg:#f6f8f8;--surface:#fff;--ink:#172426;--muted:#5c6d70;--line:#dbe3e4;--accent:#0f6b6a;--accent-soft:#e0efee;--ok:#22744a;--warn:#a5620a;--bad:#9b3434;
--sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1617;--surface:#172122;--ink:#e3ecec;--muted:#94a6a8;--line:#2a3a3c;--accent:#5fc2bf;--accent-soft:#1d3434;--ok:#6cd197;--warn:#e5a24a;--bad:#e48c8c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1617;--surface:#172122;--ink:#e3ecec;--muted:#94a6a8;--line:#2a3a3c;--accent:#5fc2bf;--accent-soft:#1d3434;--ok:#6cd197;--warn:#e5a24a;--bad:#e48c8c;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 48px;margin:0}
.top{max-width:880px;margin:0 auto 12px;display:flex;flex-direction:column;gap:6px}
h1{font-size:22px;margin:0;text-wrap:balance}
.sit{font-size:13px;color:var(--muted)}.sit b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tabs{max-width:880px;margin:0 auto 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab .t{font-weight:600;font-size:13.5px}.tab .w{font-size:11.5px;color:var(--muted)}
.tab .p{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.prog>i{display:block;height:100%;background:var(--accent)}
main{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hdr p{margin:0;font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 14px;display:flex;flex-direction:column;min-width:0}
.sub{font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 0 4px;border-bottom:1px solid var(--line)}
.sub .g{font-family:var(--mono);font-weight:400;margin-left:6px}
.it{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-bottom:1px dashed var(--line);min-width:0}
.it:last-child{border-bottom:0}
.it[data-done="1"]{border-left:3px solid var(--ok);padding-left:8px;margin-left:-11px}
.l1{font-size:13.5px;overflow-wrap:anywhere}.l1 .src{font-weight:600}.l1 .ar{color:var(--muted);margin:0 6px}.l1 b{color:var(--accent);font-weight:600}
.also{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.st{border-radius:4px;padding:0 5px;border:1px solid var(--line)}
.st[data-s="추천 제외"]{color:var(--bad);border-color:currentColor}.st[data-s="근거 약"]{color:var(--warn);border-color:currentColor}
.ans{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.opt{display:flex;gap:6px;align-items:center;padding:3px 9px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:13px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin:0;accent-color:var(--accent)}
input[type=text]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:5px 8px;min-width:0;width:100%}
.ans input[type=text]{flex:1;min-width:180px;width:auto}
.pick{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.pick .lab{font-size:12px;color:var(--muted)}
.pick .cs{display:flex;flex-wrap:wrap;gap:4px}
.pick .chip{font-size:12px;padding:2px 8px}
.sv{font-family:var(--mono);font-size:11.5px;color:var(--muted)}.sv.err{color:var(--bad)}
details summary{cursor:pointer;font-size:12px;color:var(--accent)}
details ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.btn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:6px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--surface)}
.cf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;padding:8px 10px;border:1px solid var(--warn);border-radius:6px;background:var(--surface)}
.blks{display:flex;flex-direction:column;gap:8px}
.blk{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg);min-width:0}
.bt{font-size:12.5px;font-weight:600;overflow-wrap:anywhere}.bt .g,.sl .g{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted)}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.side{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);min-width:0}
.sl{font-size:12.5px}.sl b{font-family:var(--mono);color:var(--accent);margin-right:2px}
.side ul{margin:4px 0 0;padding-left:16px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
details.many>summary{font-size:12.5px;padding:4px 0}details.many .blks{margin-top:6px}
@media (max-width:560px){.tab .w{display:none}}
</style>

<script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(v==null)continue;if(n==='text')e.textContent=v;else e.setAttribute(n,v)}for(const c of k)if(c!=null)e.append(c);return e};
const A={};let db=null,canWrite=false,onlyLeft=false,cur='doctor';
const T=Object.fromEntries(D.tabs.map(t=>[t.key,t]));
const ITEM=Object.fromEntries(D.tabs.flatMap(t=>t.items.map(i=>[i.id,i])));
// 끝 판정: 의료진 = 맞음 · 모름, 고침 · 답은 입력이 있으면 / 충돌 = 충돌마다 고름 + 「둘 다 맞음」이 있으면 메모 / 병원 = 받은 답이 있으면
const done=(tab,id)=>{const a=A[id];if(!a)return false;const v=a.value,n=(a.note||'').trim(),it=ITEM[id];
 if(tab==='hospital')return !!(typeof v==='string'&&v.trim());
 if(it&&it.kind==='conflict'){if(a.choice==='unknown')return true;if(!v||typeof v!=='object')return false;
  const cs=it.blocks.map(b=>v[b.id]);if(cs.some(c=>!c))return false;return !cs.includes('both')||!!n}
 if(a.choice==='ok'||a.choice==='unknown')return true;
 if((a.choice==='fix'||a.choice==='answered')&&typeof v==='string'&&v.trim())return true;
 return false};
const left=k=>T[k].items.filter(i=>!done(k,i.id)).length;
function top(){
 $('#sit').replaceChildren('1~8단계 질문 · 의료진 ',el('b',{text:String(T.doctor.items.length)}),' · 병원 · 원장님 ',el('b',{text:String(T.hospital.items.length)}),' · 같은 질문은 한 번만(나온 단계 표시) · 충돌 질문은 원문 값을 나란히');
 const tb=$('#tabs');tb.replaceChildren();
 D.tabs.forEach((t,k)=>{const n=t.items.length,d=n-left(t.key);
  const b=el('button',{class:'tab',role:'tab','aria-selected':String(cur===t.key),type:'button'},
   el('span',{class:'t',text:`${k+1}. ${t.title}`}),el('span',{class:'w',text:t.who}),
   el('span',{class:'p',text:`${d} / ${n} 답함`}),el('span',{class:'prog'},el('i',{style:`width:${n?Math.round(d/n*100):0}%`})));
  b.onclick=()=>{cur=t.key;render()};tb.append(b)})}
async function put(it,patch){const prev=A[it.id]||{choice:null,value:null,note:''};A[it.id]={...prev,...patch,tab:it.tab};
 if(!db||!canWrite)throw new Error('nodb');
 const a=A[it.id];await db.doc('answers/'+it.id).set({tab:it.tab,choice:a.choice??null,value:a.value??null,note:a.note||'',at:new Date().toISOString()})}
async function save(it,patch,sv,row){
 try{const p=put(it,patch);row.dataset.done=done(it.tab,it.id)?'1':'';top();sv.textContent='저장 중…';sv.className='sv';await p;
  const a=A[it.id];sv.textContent=(!done(it.tab,it.id)&&(a.choice||a.value))?'저장됨 · 아직 덜 채움':'저장됨'}
 catch(e){row.dataset.done=done(it.tab,it.id)?'1':'';top();sv.textContent=e.message==='nodb'?'저장 안 됨 — 저장소에 연결되지 않았습니다':'저장 실패 — 다시 입력해 주세요';sv.className='sv err'}}
const meta=it=>el('div',{class:'meta'},el('span',{text:it.id}),el('span',{text:it.stage_label+' · '+it.where.join(' / ')}),el('span',{class:'st','data-s':it.status,text:it.status}));
const basis=(lines,t='근거')=>lines&&lines.length?el('details',{},el('summary',{text:t}),el('ul',{},...lines.map(x=>el('li',{text:x})))):null;
function radios(it,list,sv,row,after){const a=A[it.id]||{};const g=el('div',{class:'ans',role:'radiogroup','aria-label':it.id});
 for(const[v,t]of list){const r=el('input',{type:'radio',name:'r-'+it.id,value:v});r.checked=a.choice===v;
  r.onchange=()=>{const patch={choice:v};if(v!=='fix'&&v!=='answered')patch.value=v==='ok'?it.rec:null;
   save(it,patch,sv,row);after&&after(v)};
  g.append(el('label',{class:'opt'},r,el('span',{text:t})))}
 return g}
function doctorRow(it){if(it.kind==='conflict')return conflictRow(it);if(it.kind==='open')return openRow(it);
 const a=A[it.id]||{};const row=el('div',{class:'it','data-done':done('doctor',it.id)?'1':''});const sv=el('span',{class:'sv',text:a.at?'저장됨':''});
 row.append(el('div',{class:'l1'},el('span',{class:'src',text:it.q}),el('span',{class:'ar',text:'→'}),el('b',{text:it.rec})),meta(it));
 const fix=el('input',{type:'text',placeholder:'고침 — 맞는 값','aria-label':it.id+' 고친 값'});fix.value=a.choice==='fix'&&typeof a.value==='string'?a.value:'';
 fix.onchange=()=>save(it,{choice:'fix',value:fix.value},sv,row);
 const g=radios(it,[['ok','맞음'],['fix','고침'],['unknown','모름']],sv,row,v=>{fix.hidden=v!=='fix';if(v==='fix')fix.focus()});
 fix.hidden=a.choice!=='fix';g.append(fix,sv);
 const note=el('input',{type:'text',placeholder:'메모(선택)','aria-label':it.id+' 메모'});note.value=a.note||'';note.onchange=()=>save(it,{note:note.value},sv,row);
 row.append(g,el('div',{class:'ans'},note),basis(it.basis));return row}
// 8단계 「어느 단위 시술인가」 — 추천값 없음: 답 입력 또는 모름
function openRow(it){const a=A[it.id]||{};const row=el('div',{class:'it','data-done':done('doctor',it.id)?'1':''});const sv=el('span',{class:'sv',text:a.at?'저장됨':''});
 row.append(el('div',{class:'l1',text:it.q}));if(it.now)row.append(el('div',{class:'also',text:it.now}));row.append(meta(it));
 const v=el('input',{type:'text',placeholder:'답 — 단위 시술 · 범위','aria-label':it.id+' 답'});v.value=a.choice==='answered'&&typeof a.value==='string'?a.value:'';
 const g=radios(it,[['unknown','모름']],sv,row,()=>{v.value=''});
 v.onchange=()=>{const t=v.value.trim();g.querySelectorAll('input').forEach(r=>r.checked=false);save(it,{choice:t?'answered':null,value:v.value},sv,row)};
 g.prepend(v);g.append(sv);
 const note=el('input',{type:'text',placeholder:'메모(선택)','aria-label':it.id+' 메모'});note.value=a.note||'';note.onchange=()=>save(it,{note:note.value},sv,row);
 row.append(g,el('div',{class:'ans'},note),basis(it.basis,'원문'));return row}
// 충돌 — 충돌마다 원문 값(A · B …)을 나란히, [A / B / 조건별로 둘 다 맞음 / 모름] · 메모 또는 직접 입력
function conflictRow(it){const a=A[it.id]||{};const row=el('div',{class:'it','data-done':done('doctor',it.id)?'1':''});const sv=el('span',{class:'sv',text:a.at?'저장됨':''});
 row.append(el('div',{class:'l1',text:it.q}),meta(it));
 const pick=()=>{const c=A[it.id];return c&&c.value&&typeof c.value==='object'&&!Array.isArray(c.value)?{...c.value}:{}};
 const cnt=el('span',{class:'sv'});const upd=()=>{const p=pick();cnt.textContent=`충돌 ${it.blocks.length}개 중 ${it.blocks.filter(b=>p[b.id]).length}개 고름`};
 const box=el('div',{class:'blks'});
 it.blocks.forEach((b,bi)=>{const bx=el('div',{class:'blk'},el('div',{class:'bt'},el('span',{class:'g',text:b.id}),' '+b.title));
  const grid=el('div',{class:'sides'});
  for(const s of b.sides)grid.append(el('div',{class:'side'},el('div',{class:'sl'},el('b',{text:s.k}),' '+s.label,el('span',{class:'g',text:` · ${s.lines.length}줄`})),
   s.lines.length>3?el('details',{},el('summary',{text:'원문 '+s.lines.length+'줄'}),el('ul',{},...s.lines.map(x=>el('li',{text:x})))):el('ul',{},...s.lines.map(x=>el('li',{text:x})))));
  const g=el('div',{class:'ans',role:'radiogroup','aria-label':b.id});const cur0=pick()[b.id];
  for(const[v,t]of[...b.sides.map(s=>[s.k,s.k]),['both','조건별로 둘 다 맞음(메모)'],['unknown','모름']]){
   const r=el('input',{type:'radio',name:`r-${it.id}-${bi}`,value:v});r.checked=cur0===v;
   r.onchange=()=>{const p=pick();p[b.id]=v;save(it,{choice:'conflict',value:p},sv,row).then(upd)};g.append(el('label',{class:'opt'},r,el('span',{text:t})))}
  bx.append(grid,g);box.append(bx)});
 upd();
 const note=el('input',{type:'text',placeholder:'메모 · 직접 입력 — 조건(같은 날 · 별도 세션 · 같은 부위 · 깊이)이나 맞는 값','aria-label':it.id+' 메모'});note.value=a.note||'';
 note.onchange=()=>save(it,{choice:A[it.id]?.choice||'conflict',note:note.value},sv,row);
 if(it.blocks.length>4)row.append(el('details',{class:'many'},el('summary',{text:`충돌 ${it.blocks.length}개 펼치기 — 하나씩 고르기`}),box));else row.append(box);
 row.append(el('div',{class:'ans'},note),el('div',{class:'ans'},cnt,sv),basis(it.basis));return row}
function hospRow(it){const a=A[it.id]||{};const row=el('div',{class:'it','data-done':done('hospital',it.id)?'1':''});const sv=el('span',{class:'sv',text:a.at?'저장됨':''});
 row.append(el('div',{class:'l1',text:it.q}));
 for(const x of it.also)row.append(el('div',{class:'also',text:'함께 물을 것 — '+x}));
 if(it.now)row.append(el('div',{class:'also',text:'지금 넣어 둔 값: '+it.now}));
 row.append(meta(it));
 const v=el('input',{type:'text',placeholder:'받은 답','aria-label':it.id+' 받은 답'});v.value=typeof a.value==='string'?a.value:'';
 v.onchange=()=>save(it,{choice:v.value.trim()?'answered':null,value:v.value},sv,row);
 row.append(el('div',{class:'ans'},v,sv),basis(it.ctx,'왜 묻나'));return row}
function groups(items){const m=new Map();for(const i of items){const g=i.group||'';if(!m.has(g))m.set(g,[]);m.get(g).push(i)}return m}
function copyAll(btn,out){let k=0;const txt=[...groups(T.hospital.items)].map(([g,xs])=>`[${g}]\n`+xs.map(i=>`${++k}. ${i.q}`+i.also.map(x=>`\n   - ${x.replace(/^\d단계: /,'')}`).join('')).join('\n')).join('\n\n');
 navigator.clipboard.writeText(txt).then(()=>{out.textContent=`${k}개 복사됨`;out.className='sv'},()=>{out.textContent='복사 실패 — 브라우저가 막았습니다';out.className='sv err'})}
function render(){top();const t=T[cur],m=$('#main');m.replaceChildren();
 const h=el('div',{class:'hdr'});
 if(cur==='doctor'){h.append(el('p',{text:'추천값이 있으면 「맞음」 · 다르면 「고침」. 충돌 질문은 원문 값 A · B 중 고르거나, 조건마다 둘 다 맞으면 메모.'}));m.append(h)}
 else{const out=el('span',{class:'sv'});const b=el('button',{class:'btn',type:'button',text:'질문 전체 복사'});b.onclick=()=>copyAll(b,out);
  h.append(el('p',{text:'병원에 그대로 보낼 수 있게 번호 붙은 목록으로 복사된다. 답을 받으면 칸에 적는다.'}),el('span',{},b,' ',out));m.append(h)}
 const c=el('div',{class:'card'});let n=0;const row=cur==='doctor'?doctorRow:hospRow;
 for(const[g,xs]of groups(t.items)){const ys=xs.filter(i=>!onlyLeft||!done(cur,i.id));if(!ys.length)continue;
  if(g)c.append(el('div',{class:'sub'},g,el('span',{class:'g',text:`${xs.length}개`})));for(const i of ys){c.append(row(i));n++}}
 if(!n)c.append(el('div',{class:'it',text:'남은 항목이 없습니다.'}));m.append(c)}
$('#onlyLeft').onclick=()=>{onlyLeft=!onlyLeft;$('#onlyLeft').setAttribute('aria-pressed',String(onlyLeft));render()};
render();
(async()=>{try{db=await window.claude?.use?.('db');if(!db){$('#status').textContent='답변 저장소를 쓸 수 없습니다. 로그인한 상태로 열어 주세요.';return}
 const u=await window.claude.use('user');const cw=u?.can?await u.can('data.write'):null;canWrite=cw!==false;
 const s=await db.collection('answers').get();for(const d of s.docs)A[d.id]=d.data()||{};
 $('#status').textContent=`답 ${Object.keys(A).filter(k=>ITEM[k]).length}개 불러옴 · 입력하면 바로 저장됩니다`;render()}
 catch(e){$('#status').textContent='답을 불러오지 못했습니다. 새로고침해 주세요.'}})();
