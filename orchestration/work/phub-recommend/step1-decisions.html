<style>

:root{--bg:#f6f8f8;--surface:#fff;--ink:#172426;--muted:#5c6d70;--line:#dbe3e4;--accent:#0f6b6a;--accent-soft:#e0efee;--ok:#22744a;--warn:#a5620a;--bad:#9b3434;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1617;--surface:#172122;--ink:#e3ecec;--muted:#94a6a8;--line:#2a3a3c;--accent:#5fc2bf;--accent-soft:#1d3434;--ok:#6cd197;--warn:#e5a24a;--bad:#e48c8c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1617;--surface:#172122;--ink:#e3ecec;--muted:#94a6a8;--line:#2a3a3c;--accent:#5fc2bf;--accent-soft:#1d3434;--ok:#6cd197;--warn:#e5a24a;--bad:#e48c8c;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 48px;margin:0}
.top{max-width:880px;margin:0 auto 16px;display:flex;flex-direction:column;gap:6px}
h1{font-size:22px;margin:0;text-wrap:balance}
.sit{font-size:14px}.sit b{font-family:var(--mono);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
main{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card[data-done="1"]{border-left:3px solid var(--ok)}
.head{display:flex;gap:8px;align-items:baseline}.head .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.head h2{font-size:16px;margin:0;font-weight:600;text-wrap:pretty;flex:1;min-width:0}
.head .n{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.lack{font-size:13px;color:var(--muted)}.lack b{color:var(--ink);font-weight:500}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:13.5px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px;accent-color:var(--accent)}
input[type=text],select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:5px 8px;min-width:0}
input[type=text]{width:100%}
.foot{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.sv{font-family:var(--mono)}.sv.err{color:var(--bad)}
details{border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
.ctx{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.rows{display:flex;flex-direction:column;margin-top:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .nm{font-weight:600;font-size:13.5px}.row .pn{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.row .now{font-size:12.5px;grid-column:1}
.row .b{font-size:12px;color:var(--muted);grid-column:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.row .b.open{white-space:normal}
.row select{grid-column:2;grid-row:1/span 3;align-self:start;max-width:220px}
.row select.ex{border-color:var(--warn);color:var(--warn)}
.lid{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
@media(max-width:560px){.row{grid-template-columns:minmax(0,1fr)}.row select{grid-column:1;grid-row:auto;max-width:none}}
</style>

<script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(v==null)continue;if(n==='text')e.textContent=v;else e.setAttribute(n,v)}for(const c of k)if(c!=null)e.append(c);return e};
const A={};let db=null,canWrite=false,onlyLeft=false;
const done=g=>{const a=A[g.id];return !!(a&&(a.choice!=null||(a.other||'').trim()))};
function sit(){const left=D.groups.filter(g=>!done(g)).length;$('#sit').replaceChildren(
 '제품 원장 ',el('b',{text:String(D.total)}),'행 중 ',el('b',{text:String(D.total-D.asked)}),'행 정해짐 · 나머지 ',el('b',{text:String(D.asked)}),'행이 ',el('b',{text:String(D.groups.length)}),'묶음에 걸림 · 남은 묶음 ',el('b',{text:String(left)}))}
async function save(g,patch,sv,card){const prev=A[g.id]||{choice:null,other:'',exceptions:{}};A[g.id]={...prev,...patch};card.dataset.done=done(g)?'1':'';sit();
 if(!db||!canWrite){sv.textContent='저장 안 됨 — 저장소에 연결되지 않았습니다';sv.className='sv err';return}
 sv.textContent='저장 중…';sv.className='sv';
 try{await db.doc('decisions/'+g.id).set({choice:A[g.id].choice??null,other:A[g.id].other||'',exceptions:A[g.id].exceptions||{},updated_at:new Date().toISOString()});
  const ex=Object.keys(A[g.id].exceptions||{}).length;sv.textContent='저장됨'+(ex?` · 예외 ${ex}행`:'')}
 catch(e){sv.textContent='저장 실패 — 다시 골라 주세요';sv.className='sv err'}}
function card(g){
 const a=A[g.id]||{choice:null,other:'',exceptions:{}};
 const c=el('section',{class:'card','data-done':done(g)?'1':''});
 const sv=el('span',{class:'sv',text:a.updated_at?'저장됨':''});
 c.append(el('div',{class:'head'},el('span',{class:'id',text:g.id}),el('h2',{text:g.q}),el('span',{class:'n',text:g.rows.length+'행'})));

  r.onchange=()=>{save(g,{choice:i},sv,c);syncRows()};
  opts.append(el('label',{class:'opt'},r,el('span',{text:t})))});
 c.append(opts);
 const other=el('input',{type:'text',placeholder:'다른 답(선택) — 선택지에 없으면 여기에','aria-label':g.id+' 다른 답'});other.value=a.other||'';
 other.onchange=()=>save(g,{other:other.value},sv,c);c.append(other);
 const det=el('details',{},el('summary',{text:`행 ${g.rows.length}개 · 근거 · 행마다 예외`}));
 if(g.ctx)det.append(el('p',{class:'ctx',text:g.ctx}));
 const rows=el('div',{class:'rows'});const sels=[];
 for(const r of g.rows){
  const s=el('select',{'aria-label':r.n+' 답'});
  s.append(el('option',{value:'',text:'묶음 답 따름'}));g.ch.forEach((t,i)=>s.append(el('option',{value:String(i),text:`예외: ${i+1}. ${t}`})));
  const cur=(A[g.id]?.exceptions||{})[r.id];s.value=cur==null?'':String(cur);s.classList.toggle('ex',cur!=null);
  s.onchange=()=>{const ex={...(A[g.id]?.exceptions||{})};if(s.value==='')delete ex[r.id];else ex[r.id]=Number(s.value);s.classList.toggle('ex',s.value!=='');save(g,{exceptions:ex},sv,c)};
  sels.push(s);
  const b=el('div',{class:'b',text:r.b,title:'눌러서 펼치기'});b.onclick=()=>b.classList.toggle('open');
  rows.append(el('div',{class:'row'},el('div',{},el('span',{class:'nm',text:r.n}),r.pn?el('span',{class:'pn',text:r.pn}):null,el('span',{class:'lid',text:r.id})),s,el('div',{class:'now',text:'지금 · '+r.now}),b))}
 // 묶음 답과 같은 예외는 의미 없으니 표시만 맞춘다
 function syncRows(){const ch=A[g.id]?.choice;for(const s of sels)[...s.options].forEach(o=>{o.disabled=o.value!==''&&Number(o.value)===ch})}
 syncRows();det.append(rows);c.append(det);
 c.append(el('div',{class:'foot'},el('span',{text:g.kind}),sv));
 return c}
function render(){const m=$('#main');m.replaceChildren();const gs=D.groups.filter(g=>!onlyLeft||!done(g));
 for(const g of gs)m.append(card(g));

$('#onlyLeft').onclick=()=>{onlyLeft=!onlyLeft;$('#onlyLeft').setAttribute('aria-pressed',String(onlyLeft));render()};
render();
(async()=>{try{db=await window.claude?.use?.('db');if(!db){$('#status').textContent='답변 저장소를 쓸 수 없습니다. 로그인한 상태로 열어 주세요.';return}

 catch(e){$('#status').textContent='답을 불러오지 못했습니다. 새로고침해 주세요.'}})();
})();
</script>
