<title>Procedure Hub 실버 승인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 위 상황판(메달리온 층 · 남은 결정) + 왼쪽 이동·필터 + 오른쪽 세 묶음(계열 이름 · 단위 시술 · 질문). 카드 첫 줄 = 무엇을 정하는가, 근거는 접힘 */
:root{--bg:#f6f8f8;--surface:#fff;--ink:#172426;--muted:#5c6d70;--line:#dbe3e4;--accent:#0f6b6a;--accent-soft:#e0efee;--ok:#22744a;--warn:#a5620a;--bad:#9b3434;
--sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1617;--surface:#172122;--ink:#e3ecec;--muted:#94a6a8;--line:#2a3a3c;--accent:#5fc2bf;--accent-soft:#1d3434;--ok:#6cd197;--warn:#e5a24a;--bad:#e48c8c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1617;--surface:#172122;--ink:#e3ecec;--muted:#94a6a8;--line:#2a3a3c;--accent:#5fc2bf;--accent-soft:#1d3434;--ok:#6cd197;--warn:#e5a24a;--bad:#e48c8c;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.top{max-width:1180px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
h1{font-size:22px;margin:0;text-wrap:balance}.meta{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.board{max-width:1180px;margin:0 auto 22px;display:flex;flex-direction:column;gap:10px}
.layers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3.2fr) minmax(0,1fr);gap:8px}
@media(max-width:860px){.layers{grid-template-columns:minmax(0,1fr)}}
.layer{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.layer.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.layer .lt{font-weight:600}.layer .ls{font-size:12.5px;color:var(--muted)}
.ledgers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media(max-width:600px){.ledgers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.led{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);min-width:0}
.led .ln{font-weight:600;font-size:13px}.led .lv{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.led.done .ln::after{content:" ✓";color:var(--ok)}.led.open .ln::after{content:" ●";color:var(--warn)}
.led a{color:var(--accent)}
.remain{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.remain .big{font-size:20px;font-weight:700;font-family:var(--mono)}.remain .part{font-size:13px;color:var(--muted)}.remain .part b{color:var(--ink);font-family:var(--mono)}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}aside{position:static!important}}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
input[type=search],input[type=text],textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:6px 8px}
.guide{font-size:12.5px;color:var(--muted)}.guide b{color:var(--ink)}
.nav a{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:13px;color:var(--ink);text-decoration:none;padding:3px 0}.nav a .n{font-family:var(--mono);color:var(--muted)}
.nav a:hover{color:var(--accent)}
main{display:flex;flex-direction:column;gap:30px;min-width:0}
.sec-h{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.sec-h h2{font-size:18px;margin:0}.sec-h .why{max-width:70ch}
h3{font-size:15px;margin:14px 0 6px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px;min-width:0}
.card[data-done="ok"]{border-left:3px solid var(--ok)}.card[data-done="bad"]{border-left:3px solid var(--bad)}
.ask{font-size:15px;font-weight:600;overflow-wrap:anywhere}.ask .x{color:var(--muted);font-weight:400}
.sub{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;border:1px solid currentColor;border-radius:4px;padding:0 6px}
.b-acc{color:var(--accent)}.b-warn{color:var(--warn)}.b-bad{color:var(--bad)}.b-ok{color:var(--ok)}.b-mut{color:var(--muted)}
.why{font-size:12.5px;color:var(--muted)}.why.plain{color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:6px 8px}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer;align-items:start}
.opt:hover{background:var(--accent-soft)}.opt .t{overflow-wrap:anywhere}.opt .tag{font-size:11px;font-family:var(--mono);color:var(--warn);margin-left:6px}
.opt input[type=text]{margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.btn.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.bulk{border-color:var(--ok);color:var(--ok)}.btn.bulk.armed{background:var(--ok);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.saved{font-size:12px;color:var(--muted)}.saved.err{color:var(--bad)}
details{font-size:12.5px;color:var(--muted)}summary{cursor:pointer;color:var(--accent);width:max-content;max-width:100%}
details .kv{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:2px 10px;margin-top:6px}details .kv>span:nth-child(odd){color:var(--muted)}details .kv>span:nth-child(even){color:var(--ink);overflow-wrap:anywhere}
.ev{margin:6px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:3px}.ev li{overflow-wrap:anywhere}.ev .f{font-family:var(--mono);font-size:11px;color:var(--muted)}.ev .tx{color:var(--ink)}
.more{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;padding:4px 0}
.btn:focus-visible,.chip:focus-visible,.more:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);font-size:13px}
</style>

차 묶음, 제품이 지정되지 않은 등급 표기(「HA 1cc」 · 「수입」)를 어느 제품에 걸지. 시장가에 「유닛」 표현은 0건이다","why":"규격은 시술 1회와 가격의 키다(D-02). 표기가 갈라져 있으면 같은 조합이 두 가격을 갖는다","ref":"D-01 · D-02"},"OQ-305":{"t":"단종 · 허가 취소 품목","full":"NOTES 에 따르면 의료기기 응답에 취소 · 취하 허가가 섞여 있다. 원장에 상태로 남길까, 유효 허가만 둘까. 원천(taxonomy · 시장가)에는 있는데 허가가 취소된 제품은 어떻게 할까","why":"취소된 제품이 추천에 나오면 안 된다. 반대로 지워 버리면 과거 시술 이력과 동의어가 끊긴다","ref":"D-01 · D-03"},"OQ-306":{"t":"「전신」 노드의 두 뜻","full":"DEC-002 의 「전신」은 「레이저 제모 (전신)」(몸 표면 전체)과 「전신항노화 / NAD+수액」(계통)을 모두 근거로 갖는다. 수액 · 정맥(D-05)을 같은 노드에 둘까, 나눌까","why":"「전신 제모」와 「수액」이 같은 부위로 묶이면, 시술 ↔ 부위 엣지(DEC-002 D-06)와 안전 판단이 섞인다","ref":"D-05"},"OQ-307":{"t":"「필링 등」의 범위","full":"② 가운데 필링도 수액도 아닌 11건: 여드름 4(면포압출 · PDT 계열 3) · 흉터 3(서브시전 · 병변내 주사 · 펀치) · PRP/PRF/CGF 3 · 탈모 LLLT 1(detail 에 「두피」가 있다). 「얼굴 전체」 기본값을 줄까, 따로 정할까","why":"기본값을 넓게 적용하면 두피나 바디에도 하는 시술이 얼굴로만 묶인다","ref":"D-05 · D-06 ②"},"OQ-308":{"t":"수액의 투여 경로","full":"② 수액 21건 가운데 정맥 경로가 원천에 적힌 것은 2건뿐이다. 근육 · 피하 주사일 수 있는 성분 주사(비타민D · 철분 · 비오틴 등)에도 「정맥 주사」를 일괄 적용할까, 식약처 허가(용법)를 확인한 뒤에 정할까","why":"기법 축이 틀리면 같은 성분의 정맥 / 근육 단위 시술이 하나로 합쳐진다","ref":"D-05"},"OQ-309":{"t":"실 재질(반려 ④ 6)","full":"PDO · PCL · PLCL · PLLA · PCA · PLLA+PCL 복합. 「무엇을」 하위 계열로 둘까, 제품 속성(성분/원리)으로 둘까(분류표 §10-1 · DEC-002 OQ-203)","why":"실 리프팅 단위 시술의 수와 제품 원장의 성분 필드가 이것으로 정해진다","ref":"D-01 · D-06 ④"},"OQ-310":{"t":"실 구조 · 유형(반려 ④ 3)","full":"코그 · 모노 · 볼륨실. 기법 축으로 둘까(DEC-002 OQ-201), 제품 속성으로 둘까","why":"같음","ref":"D-06 ④"},"OQ-311":{"t":"도구 · 방식명 vs 기법 · 장비(반려 ④ 7)","full":"더마롤러 · 더마스탬프 · MTS롤러(도구명인가, 기법인가) · 콜드플라즈마 · IPL · BBL스킨타이트 · 알렉산드라이트(일반 방식인가, 장비 종류인가)","why":"장비 원장에 올릴지 기법 축에 둘지가 갈린다. 장비 원장에 올리면 식약처 매칭 대상이 된다","ref":"D-01 · D-06 ④"},"OQ-312":{"t":"마케팅명(반려 ④ 17)","full":"수액 마케팅명 4 · 스킨부스터 마케팅명 3(꿀광 · 아기 · 벨벳) · 부위 · 목적 지방분해 주사 마케팅명 10(V라인 · 러브핸들 · 등살 등). 이름을 동의어로 두고 「무엇을」을 성분으로 세울까(분류표 §10-5)","why":"성분이 확인되지 않으면 식약처 매칭도 계열 배정도 안 된다","ref":"D-01 · D-06 ④"},"OQ-313":{"t":"패키지 구성(반려 ④ 13)","full":"장비 프로그램 4 · 피부관리 메뉴 6 · 토닝 조합 3. 실제 패키지인지, 구성 원천을 무엇으로 할지(DEC-002 OQ-204)","why":"패키지 = 단 let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{filt.q=e.target.value.trim().toLowerCase();render()},150)};
for(const f of D.families){if(!unT.some(u=>u.f===f.id)&&!famT.includes(f)&&!D.questions.some(q=>q.fam===f.id))continue;const b=el('button',{class:'chip','aria-pressed':'false',text:f.id,title:f.name});b.onclick=()=>{filt.fam.has(f.id)?filt.fam.delete(f.id):filt.fam.add(f.id);b.setAttribute('aria-pressed',filt.fam.has(f.id));render()};$('#famChips').append(b)}
for(const k of Object.keys(AP)){if(k==='approved')continue;const n=unT.filter(u=>u.ap===k).length;if(!n)continue;const b=el('button',{class:'chip','aria-pressed':String(filt.ap.has(k)),text:`${AP[k]} ${n}`});b.onclick=()=>{filt.ap.has(k)?filt.ap.delete(k):filt.ap.add(k);b.setAttribute('aria-pressed',filt.ap.has(k));render()};$('#apChips').append(b)}

render();
(async()=>{try{db=await window.claude?.use?.('db');if(!db){$('#status').textContent='답변 저장소를 쓸 수 없습니다. 로그인한 상태로 열어 주세요.';render();return}
 const u=await window.claude.use('user');const cw=u?.can?await u.can('data.write'):null;canWrite=cw!==false;
 let n=0;for(const col of ['families','units','questions']){const s=await db.collection(col).get();for(const d of s.docs){A[col][d.id]=d.data()||{};n++}}
 $('#status').textContent=`답 ${n}개 불러옴 · 바꾸면 바로 저장됩니다${canWrite?'':' (읽기 전용)'}`;render()}catch(e){$('#status').textContent='답을 불러오지 못했습니다. 새로고침해 주세요.'}})();
})();
</script>
